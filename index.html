<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120d">
<title>Чёрный ящик — Фабрика догадок</title>
<meta name="description" content="Головоломка о скрытых правилах: подавайте входы, наблюдайте выходы, сдавайте экзамен.">
<style>
/* =====================================================================
   СТИЛИ: ретро-футуристическая лаборатория — латунь, эмаль, стекло
   ===================================================================== */
:root {
  --font-head: "Rockwell Extra Bold", "Rockwell", "Bodoni MT Black", "Copperplate", "Copperplate Gothic Bold", "Didot", Georgia, serif;
  --font-mono: "SF Mono", "JetBrains Mono", "Menlo", "Consolas", "Liberation Mono", "Courier New", monospace;
  --font-body: "Avenir Next", "Segoe UI", "Helvetica Neue", Roboto, system-ui, sans-serif;
  --bg0: #110e0a; --bg1: #1c1712; --bg2: #2a2219;
  --brass-hi: #fff0bd; --brass: #d9a94f; --brass-mid: #b8862f; --brass-lo: #6a4510; --brass-ink: #2b1a08;
  --cream: #f4ecd6; --cream-2: #e6d8b4; --ink: #2a1d11; --ink-soft: #6b5638;
  --lamp-green: #5cff8f; --lamp-red: #ff5b3d; --lamp-amber: #ffbe4d;
  --focus: #7ff3ff;
  --enamel: #2f5d4a; --enamel-2: #1f4234; --glow: #9dffcf; --metal: #c8a057; --accent: #e0b04f;
  --gear-dur: 1s; --gear-ease: steps(10);
  --radius: 14px;
  color-scheme: dark;
}
[data-world="1"] { --enamel: #1f4a8a; --enamel-2: #14305e; --glow: #8fd0ff; --metal: #c27a45; --accent: #f08c4a; --gear-dur: 1.8s; --gear-ease: cubic-bezier(.45,.05,.55,.95); }
[data-world="2"] { --enamel: #2f343c; --enamel-2: #1d2127; --glow: #ffb36b; --metal: #9aa1a8; --accent: #ff7a2a; --gear-dur: .7s; --gear-ease: steps(4); }
[data-world="3"] { --enamel: #10221a; --enamel-2: #07130e; --glow: #5dffa6; --metal: #b9c2c4; --accent: #5dffa6; --gear-dur: 1.2s; --gear-ease: linear; }
[data-world="4"] { --enamel: #5a2230; --enamel-2: #3b1520; --glow: #ffcf8a; --metal: #b88a46; --accent: #e5b26a; --gear-dur: 2.2s; --gear-ease: cubic-bezier(.7,0,.3,1); }
[data-world="5"] { --enamel: #e8e0c8; --enamel-2: #cfc3a2; --glow: #c79bff; --metal: #d6dadd; --accent: #9b5cff; --gear-dur: .9s; --gear-ease: cubic-bezier(.2,.8,.2,1); }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font: 15px/1.45 var(--font-body);
  color: var(--cream);
  background-color: var(--bg0);
  background-image:
    radial-gradient(1200px 700px at 50% -10%, rgba(255, 196, 110, .14), transparent 60%),
    radial-gradient(900px 600px at 100% 100%, rgba(80, 160, 140, .10), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 48px),
    linear-gradient(180deg, var(--bg1), var(--bg0));
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }
.app { max-width: 1240px; margin: 0 auto; padding: 12px 16px 40px; overflow-x: clip; }

/* ---------- Заголовки ---------- */
.brass-text {
  font-family: var(--font-head);
  font-weight: 900;
  letter-spacing: .04em;
  background: linear-gradient(180deg, #fff6cf 0%, #f0c764 40%, #9a6420 52%, #e8c06a 70%, #fff0b8 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(255,190,90,.18));
}
h1, h2, h3 { margin: 0; font-family: var(--font-head); font-weight: 900; }
.mono { font-family: var(--font-mono); }

/* ---------- Кнопки ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 9px 15px; border-radius: 11px;
  font-weight: 700; font-size: 14px; letter-spacing: .02em; color: var(--brass-ink);
  border: 1px solid #5a3b10; cursor: pointer; user-select: none;
  background: linear-gradient(180deg, #fff0b8 0%, #e2b45b 42%, #b9842e 56%, #ecca7a 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.75), inset 0 -2px 0 rgba(0,0,0,.22), 0 3px 0 #4f330c, 0 7px 14px rgba(0,0,0,.45);
  transition: transform .08s ease, box-shadow .08s ease, filter .2s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active, .btn.is-pressed { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(0,0,0,.2), 0 0 0 #4f330c, 0 2px 5px rgba(0,0,0,.45); }
.btn[disabled] { filter: grayscale(.8) brightness(.65); cursor: not-allowed; }
.btn-sm { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 9px; }
.btn-icon { width: 42px; padding: 0; }
.btn-iron {
  color: #f1e7cf; border-color: #0b0a08;
  background: linear-gradient(180deg, #5b5550 0%, #35302b 50%, #26221e 52%, #3d3732 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 3px 0 #0b0a08, 0 7px 14px rgba(0,0,0,.5);
}
.btn-run, .btn-go {
  min-height: 54px; padding: 10px 24px; border-radius: 999px;
  font-family: var(--font-head); font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: #fff4e3;
  text-shadow: 0 1px 0 rgba(0,0,0,.5);
}
.btn-run {
  border-color: #4b0d05;
  background: radial-gradient(circle at 35% 28%, #ff9a7a 0%, #e04a2c 38%, #a8220f 70%, #6a1206 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.3), 0 4px 0 #3b0a03, 0 0 0 4px #c9973f, 0 0 0 6px #5a3b10, 0 10px 18px rgba(0,0,0,.5);
}
.btn-go {
  border-color: #0b3318;
  background: radial-gradient(circle at 35% 28%, #a8ffc4 0%, #2fb35c 38%, #187338 70%, #0b3a1b 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.3), 0 4px 0 #062010, 0 0 0 4px #c9973f, 0 0 0 6px #5a3b10, 0 10px 18px rgba(0,0,0,.5);
}
.btn-run:active, .btn-go:active { transform: translateY(3px); }

/* ---------- Эмалевые таблички с винтами ---------- */
.plate {
  position: relative; color: var(--ink); border-radius: var(--radius);
  background: linear-gradient(180deg, #f8f1dd, #e9dcba);
  box-shadow: 0 0 0 3px #c9973f, 0 0 0 5px #5a3b10, inset 0 1px 0 #fff, inset 0 -6px 14px rgba(120, 90, 40, .18), 0 12px 26px rgba(0,0,0,.5);
  padding: 16px;
}
.plate::before {
  content: ""; position: absolute; inset: 5px; pointer-events: none; border-radius: calc(var(--radius) - 4px);
  --s: radial-gradient(circle, #6d5022 0 1.2px, #d9bd7c 1.4px 3px, #7a5a26 3.3px 3.8px, transparent 4px);
  background: var(--s) top left / 10px 10px no-repeat, var(--s) top right / 10px 10px no-repeat, var(--s) bottom left / 10px 10px no-repeat, var(--s) bottom right / 10px 10px no-repeat;
}
.plate-dark {
  position: relative; border-radius: var(--radius); color: var(--cream);
  background: linear-gradient(180deg, var(--enamel), var(--enamel-2));
  box-shadow: 0 0 0 3px var(--metal), 0 0 0 5px #24180a, inset 0 1px 0 rgba(255,255,255,.18), inset 0 -10px 24px rgba(0,0,0,.3), 0 12px 26px rgba(0,0,0,.5);
  padding: 14px;
}
.plate-title { font-family: var(--font-head); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* =====================================================================
   КАРТА ФАБРИКИ
   ===================================================================== */
.map-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 10px 0 18px; }
.map-head h1 { font-size: clamp(30px, 7vw, 58px); line-height: .95; text-transform: uppercase; }
.map-head .sub { color: #d9c69c; margin-top: 6px; font-size: 14px; letter-spacing: .04em; }
.head-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.star-total { font-family: var(--font-mono); font-size: 15px; color: var(--lamp-amber); padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px rgba(255,200,100,.25); }
.specials { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-bottom: 26px; }
.special { display: flex; gap: 14px; align-items: center; cursor: pointer; text-align: left; border: 0; width: 100%; font: inherit; }
.special .plate-title { margin: 0; }
.special svg { flex: none; }
.special p { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); }
.special:hover { transform: translateY(-2px); }
.special { transition: transform .2s; }
.factory { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px 26px; padding-top: 10px; }
.factory::before { /* магистральная труба */
  content: ""; position: absolute; left: 4%; right: 4%; top: 50%; height: 12px; transform: translateY(-50%);
  background: linear-gradient(180deg, #7a5420, #e5bb68 40%, #8a5f22 60%, #4a300c);
  border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,.5); z-index: 0;
}
@media (max-width: 960px) { .factory { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .factory { grid-template-columns: 1fr; } .factory::before { left: 50%; right: auto; top: 0; bottom: 0; width: 12px; height: auto; transform: translateX(-50%); } }
.shop { position: relative; z-index: 1; padding-top: 44px; }
.shop-roof {
  position: absolute; top: 0; left: 0; right: 0; height: 52px;
  background: linear-gradient(180deg, #5a4a3a, #2c231b);
  clip-path: polygon(0 100%, 0 40%, 16% 0, 16% 40%, 33% 0, 33% 40%, 50% 0, 50% 40%, 66% 0, 66% 40%, 83% 0, 83% 40%, 100% 0, 100% 100%);
}
.shop-chimney { position: absolute; top: -26px; right: 12%; width: 18px; height: 46px; background: linear-gradient(90deg, #3b2a1c, #7a5b3e, #3b2a1c); border-radius: 3px 3px 0 0; }
.shop-chimney::before { content: ""; position: absolute; top: -4px; left: -4px; right: -4px; height: 8px; background: #2a1e14; border-radius: 2px; }
.puff { position: absolute; left: 50%; top: -10px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: rgba(230, 225, 215, .5); filter: blur(2px); animation: puff 4s ease-out infinite; opacity: 0; }
.puff:nth-child(2) { animation-delay: 1.3s; } .puff:nth-child(3) { animation-delay: 2.6s; }
@keyframes puff { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 15% { opacity: .7; } 100% { transform: translate(18px, -60px) scale(2.6); opacity: 0; } }
.shop-body { position: relative; }
.shop-sign { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.shop-num { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-head); font-size: 20px; color: #fff4dd; background: radial-gradient(circle at 35% 30%, var(--glow), var(--enamel) 60%, var(--enamel-2)); box-shadow: 0 0 0 3px #c9973f, 0 0 0 5px #5a3b10; }
.shop-sign h2 { font-size: 20px; letter-spacing: .04em; text-transform: uppercase; color: var(--cream); }
.shop-sign small { display: block; font-size: 12px; color: #e9dcbb; opacity: .85; }
.shop[data-world="5"] .shop-sign h2 { color: #3a2a4a; }
.shop[data-world="5"] .shop-sign small { color: #5a4a6a; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.lvl-btn {
  position: relative; aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
  font-family: var(--font-mono); font-weight: 700; font-size: 17px; color: #2b1a08;
  background: radial-gradient(circle at 50% 42%, #fffaf0 0 38%, #e9dcb9 40% 54%, transparent 56%), conic-gradient(from 200deg, #fff0b8, #b9842e, #ecca7a, #7a5419, #fff0b8);
  box-shadow: 0 3px 0 #4f330c, 0 6px 10px rgba(0,0,0,.45);
  display: grid; place-items: center; transition: transform .12s;
}
.lvl-btn:hover { transform: translateY(-2px) rotate(-4deg); }
.lvl-btn:active { transform: translateY(2px); }
.lvl-btn .stars { position: absolute; bottom: -2px; left: 0; right: 0; font-size: 11px; letter-spacing: -1px; color: #4a3a22; text-shadow: none; }
.lvl-btn .stars b { color: #ffb829; text-shadow: 0 0 4px rgba(255,170,30,.8); font-weight: 400; }
.lvl-btn.boss { background: radial-gradient(circle at 50% 42%, #fff1ea 0 38%, #e7b3a4 40% 54%, transparent 56%), conic-gradient(from 200deg, #ff9a7a, #a8220f, #ff8a6a, #5a1206, #ff9a7a); color: #4a0d03; }
.lvl-btn.cleared::after { content: ""; position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--lamp-green); box-shadow: 0 0 8px var(--lamp-green); }
.lvl-btn[disabled] { cursor: not-allowed; filter: grayscale(1) brightness(.5); transform: none; }
.shop.locked .shop-body { filter: grayscale(.85) brightness(.55); }
.lock-note { position: absolute; inset: 44px 0 0; display: grid; place-items: center; z-index: 2; pointer-events: none; text-align: center; font-weight: 700; color: #ffe2a6; text-shadow: 0 2px 4px #000; font-size: 14px; padding: 20px; }
.lock-note svg { display: block; margin: 0 auto 6px; }
.map-foot { margin-top: 30px; color: #b9a983; font-size: 13px; text-align: center; }
.debug-panel { margin: 0 0 24px; }
.debug-panel table { width: 100%; border-collapse: collapse; font: 12px/1.35 var(--font-mono); }
.debug-panel td, .debug-panel th { border-bottom: 1px solid rgba(0,0,0,.15); padding: 3px 6px; text-align: left; vertical-align: top; }
.debug-panel .bad { color: #a8220f; font-weight: 700; }
.debug-panel .good { color: #187338; font-weight: 700; }
.debug-scroll { max-height: 340px; overflow: auto; }

/* =====================================================================
   ЭКРАН УРОВНЯ
   ===================================================================== */
.lvl-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 4px 0 14px; }
.lvl-title { flex: 1 1 200px; min-width: 0; }
.lvl-title h1 { font-size: clamp(20px, 4.5vw, 30px); text-transform: uppercase; line-height: 1.05; }
.lvl-title .crumb { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #d8c391; }
.gauges { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.gauge { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 12px; background: linear-gradient(180deg, #2a231b, #15110c); box-shadow: inset 0 0 0 1px rgba(255,200,120,.22), 0 4px 10px rgba(0,0,0,.4); }
.gauge svg { display: block; }
.gauge .g-val { font-family: var(--font-mono); font-size: 18px; color: var(--lamp-amber); text-shadow: 0 0 8px rgba(255,180,60,.5); line-height: 1; }
.gauge .g-lab { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #bba57a; }
.debug-rule { width: 100%; font: 12px/1.4 var(--font-mono); background: #2b0f0f; color: #ffb4a4; padding: 6px 10px; border-radius: 8px; border: 1px dashed #ff6a4a; }
.lvl-grid { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 22px; align-items: start; }
@media (max-width: 940px) { .lvl-grid { grid-template-columns: 1fr; } }
.stage { position: relative; }
.stage::after { /* освещение экзамена */
  content: ""; position: absolute; inset: -12px 0; pointer-events: none; border-radius: 30px; opacity: 0; transition: opacity .8s;
  background: radial-gradient(ellipse at 50% 70%, transparent 30%, rgba(0, 0, 0, .55) 75%);
}
.is-exam .stage::after { opacity: 1; }
.machine-wrap { position: relative; max-width: 700px; margin: 0 auto; }
.machine-svg { display: block; width: 100%; height: auto; overflow: visible; animation: sway 7s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes sway { 0%, 100% { transform: rotate(-.35deg) translateY(0); } 50% { transform: rotate(.35deg) translateY(-1.5px); } }
.is-exam .machine-svg { filter: brightness(.72) saturate(.75) hue-rotate(-8deg); transition: filter .8s; }
.tutor {
  position: relative; margin: 0 auto 10px; max-width: 640px; padding: 12px 14px 12px 52px; border-radius: 12px;
  background: linear-gradient(180deg, #fff6d8, #f0dfae); color: var(--ink); font-size: 14px;
  box-shadow: 0 0 0 2px #c9973f, 0 8px 18px rgba(0,0,0,.45);
  animation: tutorIn .4s ease-out;
}
.tutor::before { content: "i"; position: absolute; left: 12px; top: 12px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: italic 900 18px var(--font-head); color: #fff; background: radial-gradient(circle at 35% 30%, #8fd0ff, #1f4a8a); box-shadow: 0 0 0 2px #c9973f; }
.tutor .t-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
.tutor .dots { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
@keyframes tutorIn { from { opacity: 0; transform: translateY(-6px); } }
.readout { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 6px auto 14px; min-height: 64px; max-width: 640px; padding: 8px 12px; border-radius: 12px; background: linear-gradient(180deg, #0c0f0d, #18201b); box-shadow: inset 0 2px 8px rgba(0,0,0,.8), 0 0 0 2px #6b5530, 0 0 0 4px #2a1f10; color: var(--glow); font-family: var(--font-mono); }
.readout .ro-lab { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.readout .ro-item { display: flex; align-items: center; gap: 8px; }
.readout .ro-arrow { font-size: 22px; opacity: .8; }
.readout svg { display: block; }
.readout .ro-empty { opacity: .6; font-size: 13px; }
.flash { animation: flash .6s ease-out; }
@keyframes flash { 0% { box-shadow: inset 0 2px 8px rgba(0,0,0,.8), 0 0 0 2px var(--glow), 0 0 26px var(--glow); } 100% { } }

.console { margin-top: 4px; }
.console .plate-title small { font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--ink-soft); font-weight: 400; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 14px; }
.controls .grp { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kbd-note { font-size: 12px; color: var(--ink-soft); }

/* ---------- Редакторы входа ---------- */
.editor { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
.ed-col { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
.dial { display: flex; align-items: center; gap: 6px; }
.dial input {
  width: 74px; height: 52px; text-align: center; font: 700 26px var(--font-mono); color: var(--lamp-amber);
  background: linear-gradient(180deg, #0d0b08, #241c13); border: 0; border-radius: 10px; -moz-appearance: textfield; appearance: textfield;
  box-shadow: inset 0 3px 8px rgba(0,0,0,.9), 0 0 0 2px #8a6a2c, 0 0 0 4px #2a1f10; text-shadow: 0 0 10px rgba(255,180,60,.55);
}
.dial input::-webkit-outer-spin-button, .dial input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.dial .btn { width: 40px; padding: 0; font-size: 16px; }
.slots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
.slot { width: 54px; height: 54px; padding: 3px; border-radius: 12px; border: 0; cursor: pointer; background: linear-gradient(180deg, #d9caa4, #f6eedb); box-shadow: inset 0 3px 6px rgba(80,55,20,.45), 0 0 0 1px #a88a52; display: grid; place-items: center; transition: transform .1s, box-shadow .15s; }
.slot.sel { box-shadow: inset 0 3px 6px rgba(80,55,20,.45), 0 0 0 3px #2a7bd8, 0 0 12px rgba(42,123,216,.6); }
.slot:active { transform: scale(.94); }
.slot svg { display: block; width: 100%; height: 100%; }
.slot-word { font: 900 26px var(--font-head); color: var(--ink); }
.len-ctl { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-soft); }
.palette { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 2px; cursor: pointer; background: transparent; box-shadow: 0 0 0 2px #a88a52; transition: transform .1s; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px #2a7bd8, 0 0 12px rgba(42,123,216,.7); }
.swatch:active { transform: scale(.9); }
.swatch svg { display: block; width: 100%; height: 100%; }
.seg { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.seg-lab { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); width: 62px; text-align: right; }
.seg button { min-width: 44px; height: 40px; border-radius: 9px; border: 1px solid #a88a52; background: linear-gradient(180deg, #fffaf0, #e8dab8); cursor: pointer; font-weight: 700; display: grid; place-items: center; padding: 2px 6px; }
.seg button[aria-pressed="true"] { background: linear-gradient(180deg, #2a5f9a, #1a3c66); color: #fff; border-color: #0d2340; box-shadow: inset 0 2px 4px rgba(0,0,0,.4); }
.seg button svg { width: 26px; height: 26px; display: block; }
.grid-ed { display: grid; width: max-content; margin: 0 auto; gap: 5px; padding: 8px; border-radius: 12px; background: #111; box-shadow: inset 0 3px 8px rgba(0,0,0,.9), 0 0 0 2px #8a6a2c, 0 0 0 4px #2a1f10; }
.cell { width: 46px; height: 46px; border-radius: 8px; border: 0; cursor: pointer; background: radial-gradient(circle at 40% 35%, #3b3f3a, #1b1d1b); box-shadow: inset 0 0 0 1px #000, inset 0 2px 3px rgba(255,255,255,.06); transition: background .12s, box-shadow .12s, transform .08s; position: relative; }
.cell[aria-pressed="true"] { background: radial-gradient(circle at 40% 35%, #f7ffd8, var(--lamp-green) 45%, #16803d); box-shadow: 0 0 12px rgba(92,255,143,.65), inset 0 0 0 1px #0b4d22; }
.cell[aria-pressed="true"]::after { content: ""; position: absolute; inset: 35%; border-radius: 2px; background: rgba(0,60,20,.45); }
.cell:active { transform: scale(.92); }
.grid-ed.n4 .cell { width: 40px; height: 40px; }
.keys { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.keys .btn { min-width: 46px; font-family: var(--font-head); font-size: 20px; }
.boolpick { display: flex; gap: 14px; justify-content: center; }
.boolpick button { width: 92px; height: 64px; border-radius: 14px; border: 1px solid #a88a52; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; background: linear-gradient(180deg, #fffaf0, #e8dab8); }
.boolpick button[aria-pressed="true"] { background: linear-gradient(180deg, #2a5f9a, #1a3c66); color: #fff; }
.boolpick svg { width: 30px; height: 30px; }

/* ---------- Экзамен ---------- */
.exam-list { display: grid; gap: 12px; }
.exam-q { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px rgba(120,90,40,.35); }
.exam-q .q-lamp { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 800 14px var(--font-mono); color: #fff; background: radial-gradient(circle at 35% 30%, #777, #222); box-shadow: 0 0 0 2px #8a6a2c; transition: background .3s, box-shadow .3s; }
.exam-q.ok .q-lamp { background: radial-gradient(circle at 35% 30%, #e6ffef, var(--lamp-green) 45%, #127a35); box-shadow: 0 0 0 2px #8a6a2c, 0 0 16px var(--lamp-green); color: #063; }
.exam-q.bad .q-lamp { background: radial-gradient(circle at 35% 30%, #ffe2da, var(--lamp-red) 45%, #8a1a08); box-shadow: 0 0 0 2px #8a6a2c, 0 0 16px var(--lamp-red); }
.q-in { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; color: var(--ink-soft); }
.q-in svg { display: block; }
.q-hist { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.q-hist .faded { opacity: .55; }
.exam-warn { margin-top: 8px; font-size: 13px; color: #8a1a08; min-height: 1em; }

/* ---------- Боковая панель: журнал, заметки, подсказки ---------- */
.side { display: grid; gap: 22px; }
.journal-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.journal-tools select { flex: 1 1 120px; min-height: 36px; border-radius: 9px; border: 1px solid #a88a52; padding: 4px 8px; background: #fffaf0; color: var(--ink); font-size: 13px; }
.journal {
  list-style: none; margin: 0; padding: 0; max-height: 380px; overflow: auto; border-radius: 10px;
  background: repeating-linear-gradient(180deg, #fffdf4 0 37px, #c9d9e6 37px 38px); box-shadow: inset 0 0 0 1px #c9b98f;
}
@media (max-width: 940px) { .journal { max-height: 300px; } }
.jrow { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 6px 8px; border-left: 5px solid transparent; animation: rowIn .35s ease-out; }
@keyframes rowIn { from { background: rgba(255, 210, 90, .55); } to { background: transparent; } }
.jrow .jn { font: 700 12px var(--font-mono); color: #8a7550; text-align: right; }
.jrow .jio { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
.jrow .jio svg { display: block; flex: none; }
.jrow .jarrow { color: #8a7550; font-weight: 700; }
.jrow .jbadge { font: 700 10px var(--font-mono); padding: 1px 5px; border-radius: 6px; background: #2a1d11; color: #ffd27a; }
.jrow .jbadge.exam { background: #8a1a08; color: #fff; }
.jrow .jbtns { display: flex; gap: 2px; }
.jrow .jbtns button { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; color: #8a7550; font-size: 15px; }
.jrow .jbtns button:hover { background: rgba(0,0,0,.07); }
.jrow .jbtns button[aria-pressed="true"] { color: #2a1d11; background: rgba(0,0,0,.08); }
.jrow.pinned { background: rgba(255, 220, 130, .35); }
.jrow.mark-1 { border-left-color: #d8402e; } .jrow.mark-2 { border-left-color: #2fa35a; } .jrow.mark-3 { border-left-color: #2f67c9; }
.mk1 { color: #d8402e !important; } .mk2 { color: #2fa35a !important; } .mk3 { color: #2f67c9 !important; }
.journal-empty { padding: 18px; text-align: center; color: #8a7550; font-size: 13px; }
.notes { width: 100%; min-height: 110px; resize: vertical; border-radius: 10px; border: 0; padding: 10px 12px; font: 14px/1.5 var(--font-mono); color: var(--ink); background: repeating-linear-gradient(180deg, #fffdf4 0 23px, #e8d9b4 23px 24px); box-shadow: inset 0 0 0 1px #c9b98f; }
.hint-list { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 8px; }
.hint-list li { padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.6); box-shadow: inset 0 0 0 1px rgba(120,90,40,.35); font-size: 14px; }
.hint-list li b { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.hint-list .hint-in { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.won-banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.won-banner .big-stars { font-size: 28px; color: #ffb829; text-shadow: 0 0 10px rgba(255,170,30,.7); letter-spacing: 2px; }

/* =====================================================================
   МАШИНА (SVG)
   ===================================================================== */
.m-body { fill: var(--metal); stroke: #3a2508; stroke-width: 2; }
.m-item { transform-box: fill-box; transform-origin: center; }
.m-plate { fill: var(--enamel); }
.m-plate-hi { fill: none; stroke: rgba(255,255,255,.2); stroke-width: 1.5; }
.m-tray { fill: url(#mTray); stroke: #3a2508; stroke-width: 1.5; }
.m-rivet { fill: url(#mRivet); }
.m-label { font: 900 10.5px var(--font-head); letter-spacing: .12em; fill: #2a1a06; text-transform: uppercase; }
.m-mono { font: 700 11px var(--font-mono); fill: var(--glow); }
.m-glow { fill: var(--glow); }
.m-accent { fill: var(--accent); }
.m-metal { fill: var(--metal); }
.m-dark { fill: #120e0a; }
.m-glass { fill: url(#mGlass); stroke: rgba(255,255,255,.55); stroke-width: 1.2; }
.m-gear { fill: url(#mGearFill); stroke: #3a2508; stroke-width: 1; transform-box: fill-box; transform-origin: center; }
.m-lamp { fill: #3b1f12; stroke: #2a1808; stroke-width: 1.5; transition: fill .25s; }
.m-lamp.on { fill: var(--lamp-amber); filter: url(#mBloom); }
.m-lamp.ok { fill: var(--lamp-green); filter: url(#mBloom); }
.m-lamp.bad { fill: var(--lamp-red); filter: url(#mBloom); }
.m-needle { transform-box: view-box; transition: transform .6s cubic-bezier(.3,1.6,.5,1); }
.m-anim { transform-box: fill-box; transform-origin: center; }
.m-shutters { transform: translateY(-172px); transition: transform .7s cubic-bezier(.6,0,.3,1.2); }
.is-exam .m-shutters { transform: translateY(0); }
.m-slat { fill: url(#mSlat); stroke: #2a1808; stroke-width: .8; }
.m-door { transform-box: fill-box; transition: transform 1.1s cubic-bezier(.5,0,.2,1); }
.m-door-l { transform-origin: left center; } .m-door-r { transform-origin: right center; }
.revealed .m-door-l, .revealed .m-door-r { transform: scaleX(.07); }
.m-decor { transition: opacity .6s; }
.revealed .m-decor { opacity: 0; }
.m-cavity-core { opacity: 0; transition: opacity 1s .6s; }
.revealed .m-cavity-core { opacity: 1; }
.revealed .m-cavity-gear { animation: spin 6s linear infinite; }
.revealed .m-cavity-gear.rev { animation-direction: reverse; animation-duration: 4s; }

/* анимация работы — одинаковая для любого входа, отличается только по миру */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0%, 49% { fill: var(--lamp-amber); } 50%, 100% { fill: #3b1f12; } }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-46px); opacity: 0; } }
@keyframes roll { to { transform: translateY(-120px); } }
@keyframes belt { to { transform: translateX(-16px); } }
@keyframes claw { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(46px); } 50% { transform: translateX(46px) translateY(10px); } 75% { transform: translateX(-30px); } }
@keyframes flicker { 0%, 100% { opacity: .2; } 30% { opacity: 1; } 60% { opacity: .45; } 80% { opacity: .9; } }
@keyframes scan { from { transform: translateY(0); } to { transform: translateY(64px); } }
@keyframes zap { 0%, 100% { opacity: 0; } 20%, 40% { opacity: 1; } 30% { opacity: .2; } }
@keyframes crank { to { transform: rotate(360deg); } }
@keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-1.2px, .6px); } 75% { transform: translate(1.2px, -.6px); } }
@keyframes bubbleIdle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
@keyframes needleIdle { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
.running .m-gear { animation: spin var(--gear-dur) var(--gear-ease) infinite; }
.running .m-gear.rev { animation-direction: reverse; }
.running .m-lamp.run { animation: blink .26s steps(1) infinite; animation-delay: calc(var(--i) * 70ms); }
.running .m-shake { animation: shake .12s linear infinite; }
.running .m-drum { animation: roll .9s cubic-bezier(.5,0,.5,1) 1; }
.running .m-bubble { animation: rise .7s ease-in infinite; animation-delay: calc(var(--i) * 120ms); }
.running .m-belt { animation: belt .25s steps(2) infinite; }
.running .m-claw { animation: claw 1s steps(6) 1; }
.running .m-phos { animation: flicker .18s steps(2) infinite; animation-delay: calc(var(--i) * 37ms); }
.running .m-scan { animation: scan .5s linear infinite; }
.running .m-reel { animation: spin .5s linear infinite; }
.running .m-reel.rev { animation-direction: reverse; animation-duration: .7s; }
.running .m-zap { animation: zap .16s steps(2) infinite; }
.running .m-crank { animation: crank .5s linear infinite; }
.m-crank { transform-box: fill-box; transform-origin: 6px 6px; }
.m-idle-needle { animation: needleIdle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.m-idle-bubble { animation: bubbleIdle 2.6s ease-in-out infinite; }
.m-zap { opacity: 0; }
.m-phos { opacity: .35; }
.m-scan { opacity: .25; }

/* ---------- Модальное окно ---------- */
.modal-back { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(8, 6, 4, .72); backdrop-filter: blur(3px); animation: fadeIn .25s ease-out; }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; animation: popIn .35s cubic-bezier(.2,1.4,.4,1); }
.modal h2 { font-size: 24px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
.modal p { margin: 8px 0; }
.modal .m-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 16px; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: scale(.92) translateY(10px); } }
.win-stars { display: flex; justify-content: center; gap: 10px; margin: 6px 0 12px; }
.win-stars svg { width: 58px; height: 58px; animation: starIn .5s cubic-bezier(.2,1.6,.4,1) both; }
.win-stars svg:nth-child(2) { animation-delay: .25s; } .win-stars svg:nth-child(3) { animation-delay: .5s; }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); opacity: 0; } }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { text-align: center; padding: 8px 4px; border-radius: 10px; background: #15110c; color: var(--lamp-amber); box-shadow: inset 0 2px 6px rgba(0,0,0,.8), 0 0 0 2px #8a6a2c; }
.stat b { display: block; font: 700 24px var(--font-mono); text-shadow: 0 0 8px rgba(255,180,60,.5); }
.stat span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #c8b07e; }
.rule-card { padding: 12px 14px; border-radius: 10px; background: #15110c; color: #f6ecd2; box-shadow: inset 0 0 0 1px #8a6a2c; font-size: 15px; }
.rule-card b { color: var(--lamp-amber); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; display: block; margin-bottom: 4px; }
.trace { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; padding: 12px; border-radius: 12px; background: linear-gradient(180deg, #0c0f0d, #18201b); box-shadow: inset 0 2px 8px rgba(0,0,0,.8); color: var(--glow); }
.trace .t-step { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0; animation: stepIn .5s ease-out forwards; }
.trace .t-op { font: 11px/1.2 var(--font-mono); max-width: 140px; text-align: center; color: #cde; opacity: 0; animation: stepIn .5s ease-out forwards; }
.trace .t-op::before { content: "⟶"; display: block; font-size: 22px; color: var(--glow); }
.trace .t-cap { font: 10px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
@keyframes stepIn { from { opacity: 0; transform: translateX(-10px) scale(.9); } to { opacity: 1; transform: none; } }
.wrong-list { display: grid; gap: 10px; margin: 10px 0; }
.wrong { display: grid; gap: 6px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px rgba(160,40,20,.4); }
.wrong .w-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.wrong svg { display: block; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60; padding: 10px 16px; border-radius: 10px; background: #15110c; color: var(--lamp-amber); box-shadow: 0 0 0 2px #8a6a2c, 0 10px 20px rgba(0,0,0,.6); font-size: 14px; max-width: calc(100% - 32px); animation: fadeIn .2s; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

/* ---------- Уменьшение движения ---------- */
.rm *, .rm *::before, .rm *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .15s !important; }
.rm .machine-svg { animation: none; }
.rm .puff { display: none; }
@media (max-width: 420px) {
  .app { padding: 8px 12px 30px; }
  .plate, .plate-dark { padding: 12px; }
  .slot { width: 48px; height: 48px; }
  .cell { width: 40px; height: 40px; }
  .grid-ed.n4 .cell { width: 36px; height: 36px; }
  .dial input { width: 62px; }
  .btn-run, .btn-go { font-size: 15px; padding: 10px 18px; }
  .gauge .g-val { font-size: 16px; }
}
</style>
</head>
<body>
<!-- Общие узоры и градиенты для шаров и фигур (различение без цвета) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="pt0" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="rgba(255,255,255,.75)"/></pattern>
    <pattern id="pt1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.2" height="6" fill="rgba(80,30,0,.45)"/></pattern>
    <pattern id="pt2" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 3.5h7M3.5 0v7" stroke="rgba(90,60,0,.5)" stroke-width="1.1"/></pattern>
    <pattern id="pt3" width="8" height="5" patternUnits="userSpaceOnUse"><path d="M0 3 Q2 0 4 3 T8 3" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.1"/></pattern>
    <pattern id="pt4" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="2" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1"/></pattern>
    <pattern id="pt5" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M3.5 0.5 L6.5 3.5 L3.5 6.5 L0.5 3.5Z" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1"/></pattern>
    <pattern id="pt6" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M1 1 L5 5 M5 1 L1 5" stroke="rgba(255,255,255,.55)" stroke-width="1"/></pattern>
    <radialGradient id="gloss" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".35" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient>
    <linearGradient id="plateG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf7e6"/><stop offset="1" stop-color="#e3d3ab"/></linearGradient>
    <radialGradient id="lampOn" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#f4ffe9"/><stop offset=".45" stop-color="#5cff8f"/><stop offset="1" stop-color="#0f6a2d"/></radialGradient>
    <radialGradient id="lampOff" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#ffb2a2"/><stop offset=".45" stop-color="#7a1c10"/><stop offset="1" stop-color="#2b0904"/></radialGradient>
    <linearGradient id="starG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#ffbe2e"/><stop offset="1" stop-color="#b86e00"/></linearGradient>
  </defs>
</svg>

<div class="app" id="app">
  <!-- ===== Экран карты ===== -->
  <section id="scr-map" class="screen" aria-labelledby="mapTitle">
    <header class="map-head">
      <div>
        <h1 id="mapTitle" class="brass-text">Фабрика догадок</h1>
        <div class="sub">Чёрный ящик · найдите скрытое правило каждой машины</div>
      </div>
      <div class="head-tools">
        <span class="star-total" id="starTotal" aria-live="polite"></span>
        <button class="btn btn-iron btn-sm" id="btnMotion" type="button" aria-pressed="false">Меньше анимации</button>
        <button class="btn btn-iron btn-icon" id="btnSoundMap" type="button" aria-label="Звук"></button>
      </div>
    </header>
    <div id="debugPanel" class="debug-panel plate" hidden></div>
    <div class="specials" id="specials"></div>
    <div class="factory" id="factory" role="list" aria-label="Цеха фабрики"></div>
    <p class="map-foot">Пройдите босса цеха, чтобы открыть следующий. Три звезды — уложиться в цель по числу экспериментов.</p>
  </section>

  <!-- ===== Экран уровня ===== -->
  <section id="scr-level" class="screen" hidden aria-labelledby="lvlTitle">
    <header class="lvl-head">
      <button class="btn btn-iron btn-icon" id="btnBack" type="button" aria-label="Назад к карте фабрики">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 3 L5 10 L13 17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="lvl-title">
        <div class="crumb" id="lvlCrumb"></div>
        <h1 id="lvlTitle" class="brass-text"></h1>
      </div>
      <div class="gauges">
        <div class="gauge" role="group" aria-label="Эксперименты и цель">
          <svg id="expGauge" width="56" height="40" viewBox="0 0 56 40" aria-hidden="true"></svg>
          <div><div class="g-val" id="expVal">0/0</div><div class="g-lab">опыты / цель</div></div>
        </div>
        <div class="gauge" role="group" aria-label="Проваленные экзамены и подсказки">
          <div style="padding-left:6px"><div class="g-val" id="failVal">0</div><div class="g-lab">провалы</div></div>
          <div><div class="g-val" id="hintVal">0/3</div><div class="g-lab">подсказки</div></div>
        </div>
        <button class="btn btn-iron btn-icon" id="btnSound" type="button" aria-label="Звук"></button>
      </div>
      <div class="debug-rule" id="debugRule" hidden></div>

<script>
'use strict';
/* =====================================================================
   МОДУЛЬ 1. ГЕНЕРАТОР СЛУЧАЙНЫХ ЧИСЕЛ С ЗЕРНОМ
   ===================================================================== */
const RNG = (() => {
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function make(seed) {
    const f = mulberry32(seed >>> 0);
    return {
      next: f,
      int: (a, b) => a + Math.floor(f() * (b - a + 1)),
      pick: arr => arr[Math.floor(f() * arr.length)],
      chance: p => f() < p,
      shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
        return a;
      }
    };
  }
  function hash(...parts) {
    let h = 2166136261 >>> 0;
    const s = parts.join('|');
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
    return h >>> 0;
  }
  return { make, hash };
})();

/* =====================================================================
   МОДУЛЬ 2. ПРЕДМЕТНАЯ ОБЛАСТЬ: цвета, фигуры, буквы, текстовые формы
   ===================================================================== */
const D = (() => {
  const COLORS = ['#d8402e', '#f08c1e', '#f3cb2c', '#3d9c4c', '#2f67c9', '#8c48b9', '#7d5533'];
  const CNAME = ['красный', 'оранжевый', 'жёлтый', 'зелёный', 'синий', 'фиолетовый', 'бурый'];
  const CSHORT = ['К', 'О', 'Ж', 'З', 'С', 'Ф', 'Б'];
  const SHAPE_F = ['круг', 'квадрат', 'треугольник'];
  const SHAPE_C = [0, 4, 2];              // цвета фигур → индексы палитры
  const SHAPE_CN = ['красный', 'синий', 'жёлтый'];
  const SIZE_N = ['малый', 'большой'];
  const LETTERS = ['А', 'О', 'У', 'Б', 'В', 'Р'];
  const ATTR_N = { f: 'форма', c: 'цвет', s: 'размер' };
  const isVowel = i => i < 3;
  const shp = (f, c, s) => f * 6 + c * 2 + s;
  const sf = x => Math.floor(x / 6), sc = x => Math.floor(x / 2) % 3, ss = x => x % 2;
  const attr = (x, p) => (p === 'f' ? sf(x) : p === 'c' ? sc(x) : ss(x));
  const key = v => JSON.stringify(v);
  const eq = (a, b) => key(a) === key(b);
  const plural = (n, one, few, many) => {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  };
  /* Таблица смешения: одинаковые → тот же; через один по кругу → средний;
     соседние → тот, что ближе к красному; противоположные → бурый. */
  function mix(a, b) {
    if (a === b) return a;
    const d = Math.abs(a - b), dd = Math.min(d, 6 - d);
    if (dd === 3) return 6;
    if (dd === 2) return d === 2 ? (a + b) / 2 : (Math.max(a, b) + 1) % 6;
    const rd = c => Math.min(c, 6 - c);
    return rd(a) < rd(b) ? a : b;
  }
  const shapeText = x => `${SIZE_N[ss(x)]} ${SHAPE_CN[sc(x)]} ${SHAPE_F[sf(x)]}`;
  function gridRows(g) {
    const n = Math.round(Math.sqrt(g.length)), rows = [];
    for (let r = 0; r < n; r++) rows.push(g.slice(r * n, r * n + n).map(v => (v ? '■' : '□')).join(''));
    return rows;
  }
  /* kind: nums | num | col | cols | shps | grid | bool | word */
  function valText(kind, v) {
    switch (kind) {
      case 'nums': return v.join(', ');
      case 'num': return String(v);
      case 'col': return CNAME[v];
      case 'cols': return v.map(c => CNAME[c]).join(', ');
      case 'shps': return v.map(shapeText).join('; ');
      case 'grid': return 'сетка ' + gridRows(v).join(' / ');
      case 'bool': return v ? 'да, лампа горит' : 'нет, лампа не горит';
      case 'word': return v.map(i => LETTERS[i]).join('');
    }
    return String(v);
  }
  function valShort(kind, v) {
    switch (kind) {
      case 'nums': return v.join(' · ');
      case 'col': return CNAME[v];
      case 'cols': return v.map(c => CSHORT[c]).join('');
      case 'shps': return v.map(x => ['●', '■', '▲'][sf(x)] + CSHORT[SHAPE_C[sc(x)]] + (ss(x) ? '⁺' : '')).join(' ');
      case 'grid': return gridRows(v).join('|');
      case 'bool': return v ? 'ДА' : 'НЕТ';
      case 'word': return v.map(i => LETTERS[i]).join('');
    }
    return String(v);
  }
  return { COLORS, CNAME, CSHORT, SHAPE_F, SHAPE_C, SHAPE_CN, SIZE_N, LETTERS, ATTR_N, isVowel, shp, sf, sc, ss, attr, key, eq, plural, mix, shapeText, valText, valShort, gridRows };
})();

/* =====================================================================
   МОДУЛЬ 3. БИБЛИОТЕКА ПРАВИЛ (чистые функции, без обращения к странице)
   ===================================================================== */
const Rules = (() => {
  const { attr, isVowel, mix, CNAME, ATTR_N } = D;
  /* ---------- примитивные операции ---------- */
  const O = {
    sum: a => a.reduce((s, x) => s + x, 0),
    digitSum: n => { n = Math.abs(n); let s = 0; while (n > 0) { s += n % 10; n = Math.floor(n / 10); } return s; },
    mod: (a, m) => ((a % m) + m) % m,
    count: (a, p) => a.filter(p).length,
    rev: a => a.slice().reverse(),
    rotL: (a, k) => { const n = a.length; if (!n) return []; k = ((k % n) + n) % n; return a.slice(k).concat(a.slice(0, k)); },
    sortBy: (a, kf) => a.map((v, i) => [v, i]).sort((x, y) => kf(x[0]) - kf(y[0]) || x[1] - y[1]).map(p => p[0]),
    freq: a => { const m = new Map(); a.forEach(x => m.set(x, (m.get(x) || 0) + 1)); return m; },
    runs: a => (a.length ? 1 + a.slice(1).filter((x, i) => x !== a[i]).length : 0),
    gn: g => Math.round(Math.sqrt(g.length)),
  };
  O.gmap = (g, fn) => { const n = O.gn(g), o = new Array(n * n); for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) o[r * n + c] = fn(r, c, n); return o; };
  O.at = (g, n, r, c) => g[r * n + c];
  O.nbrs = (g, n, r, c, eight, torus) => {
    let s = 0;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      if (!eight && dr && dc) continue;
      let rr = r + dr, cc = c + dc;
      if (torus) { rr = O.mod(rr, n); cc = O.mod(cc, n); } else if (rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
      s += O.at(g, n, rr, cc);
    }
    return s;
  };
  const G = {
    flipH: g => O.gmap(g, (r, c, n) => O.at(g, n, r, n - 1 - c)),
    flipV: g => O.gmap(g, (r, c, n) => O.at(g, n, n - 1 - r, c)),
    transpose: g => O.gmap(g, (r, c, n) => O.at(g, n, c, r)),
    antiT: g => O.gmap(g, (r, c, n) => O.at(g, n, n - 1 - c, n - 1 - r)),
    rotCW: g => O.gmap(g, (r, c, n) => O.at(g, n, n - 1 - c, r)),
    rotCCW: g => O.gmap(g, (r, c, n) => O.at(g, n, c, n - 1 - r)),
    rot180: g => O.gmap(g, (r, c, n) => O.at(g, n, n - 1 - r, n - 1 - c)),
    invert: g => g.map(x => 1 - x),
    shift: (g, dr, dc, wrap) => O.gmap(g, (r, c, n) => {
      let rr = r - dr, cc = c - dc;
      if (wrap) { rr = O.mod(rr, n); cc = O.mod(cc, n); } else if (rr < 0 || cc < 0 || rr >= n || cc >= n) return 0;
      return O.at(g, n, rr, cc);
    }),
    life: (g, B, S, torus) => O.gmap(g, (r, c, n) => {
      const k = O.nbrs(g, n, r, c, true, torus);
      return O.at(g, n, r, c) ? (S.includes(k) ? 1 : 0) : (B.includes(k) ? 1 : 0);
    }),
  };
  G.symH = g => D.eq(G.flipH(g), g);
  G.symV = g => D.eq(G.flipV(g), g);

  /* ---------- конструктор правила ----------
     Правило — объект: id, desc (для раскрытия), inType, outType,
     run(hist) — выход на последний вход истории после сброса,
     parts — составляющие (для композиций). */
  function mkRule(o) {
    const r = { id: o.id, desc: o.desc, inType: o.inType, outType: o.outType, parts: o.parts || null, stateful: !!o.step, midType: o.midType || null };
    if (o.step) {
      r.step = o.step; r.init = o.init;
      r.run = seq => { let st = o.init(), out; for (const x of seq) { const res = o.step(x, st); out = res[0]; st = res[1]; } return out; };
    } else {
      r.f = o.f;
      r.run = seq => o.f(seq[seq.length - 1]);
    }
    return r;
  }
  const F = (id, desc, inType, outType, f) => mkRule({ id, desc, inType, outType, f });
  const M = (id, desc, inType, outType, init, step) => mkRule({ id, desc, inType, outType, init, step });
  const lowerFirst = s => s.charAt(0).toLowerCase() + s.slice(1);
  const compose = (a, b, desc) => mkRule({
    id: a.id + '>' + b.id, desc: desc || (a.desc + '; затем ' + lowerFirst(b.desc)),
    inType: a.inType, outType: b.outType, midType: a.outType, f: x => b.f(a.f(x)), parts: [a, b]
  });

  const NOUN = { cols: 'шары', shps: 'фигуры', word: 'буквы' };
  const q = c => `«${CNAME[c]}»`;
  const P = {};
  const shapeColorName = ['красные', 'синие', 'жёлтые'];

  /* ---------- Арифметика: одно число ---------- */
  P.add = a => F('add' + a, `Выход = n + ${a}`, 'nums', 'num', x => x[0] + a);
  P.mul = k => F('mul' + k, `Выход = ${k} · n`, 'nums', 'num', x => k * x[0]);
  P.lin = (k, b) => F(`lin${k}_${b}`, `Выход = ${k} · n + ${b}`, 'nums', 'num', x => k * x[0] + b);
  P.linIn = (k, b) => F(`linIn${k}_${b}`, `Выход = ${k} · (n + ${b})`, 'nums', 'num', x => k * (x[0] + b));
  P.addEven = a => F('addEven' + a, `Чётные числа увеличиваются на ${a}, нечётные проходят без изменений`, 'nums', 'num', x => (x[0] % 2 === 0 ? x[0] + a : x[0]));
  P.square = () => F('sq', 'Выход = n · n', 'nums', 'num', x => x[0] * x[0]);
  P.digitSum = () => F('dsum', 'Выход — сумма цифр числа', 'nums', 'num', x => O.digitSum(x[0]));
  P.maxDigit = () => F('maxd', 'Выход — наибольшая цифра числа', 'nums', 'num', x => Math.max(...String(x[0]).split('').map(Number)));
  P.digitDiff = () => F('ddiff', 'Выход — разность двух цифр числа по модулю (у однозначных десятки = 0)', 'nums', 'num', x => Math.abs(Math.floor(x[0] / 10) % 10 - x[0] % 10));
  P.mod = m => F('mod' + m, `Выход — остаток от деления n на ${m}`, 'nums', 'num', x => O.mod(x[0], m));
  P.div = m => F('div' + m, `Выход — целая часть от деления n на ${m}`, 'nums', 'num', x => Math.floor(x[0] / m));
  P.dsumMod = m => F('dsumMod' + m, `Выход — остаток от деления суммы цифр на ${m}`, 'nums', 'num', x => O.mod(O.digitSum(x[0]), m));
  P.dsumOfMul = k => F('dsumOfMul' + k, `Выход — сумма цифр числа ${k} · n`, 'nums', 'num', x => O.digitSum(k * x[0]));
  P.dsumPlus = k => F('dsumPlus' + k, `Выход — сумма цифр плюс ${k}`, 'nums', 'num', x => O.digitSum(x[0]) + k);
  P.mod9mul = k => F('mod9mul' + k, `Выход — остаток от деления n на 9, умноженный на ${k}`, 'nums', 'num', x => O.mod(x[0], 9) * k);
  P.numMul = k => F('nmul' + k, `Умножить на ${k}`, 'num', 'num', v => v * k);
  /* ---------- Арифметика: пара ---------- */
  P.max2 = () => F('max2', 'Выход — большее из двух чисел', 'nums', 'num', x => Math.max(x[0], x[1]));
  P.min2 = () => F('min2', 'Выход — меньшее из двух чисел', 'nums', 'num', x => Math.min(x[0], x[1]));
  P.first = () => F('first', 'Выход — первое число пары', 'nums', 'num', x => x[0]);
  P.second = () => F('second', 'Выход — второе число пары', 'nums', 'num', x => x[1]);
  P.absDiff = () => F('absDiff', 'Выход — разность чисел по модулю: |a − b|', 'nums', 'num', x => Math.abs(x[0] - x[1]));
  P.posDiff = () => F('posDiff', 'Выход — a − b, но не меньше нуля', 'nums', 'num', x => Math.max(x[0] - x[1], 0));
  P.sum2 = () => F('sum2', 'Выход = a + b', 'nums', 'num', x => x[0] + x[1]);
  P.sumMod10 = () => F('sumMod10', 'Выход — последняя цифра суммы a + b', 'nums', 'num', x => (x[0] + x[1]) % 10);
  /* ---------- Арифметика: тройка ---------- */
  P.sum3 = () => F('sum3', 'Выход = a + b + c', 'nums', 'num', x => x[0] + x[1] + x[2]);
  P.max3 = () => F('max3', 'Выход — наибольшее из трёх', 'nums', 'num', x => Math.max(...x));
  P.min3 = () => F('min3', 'Выход — наименьшее из трёх', 'nums', 'num', x => Math.min(...x));
  P.median3 = () => F('med3', 'Выход — среднее по величине из трёх', 'nums', 'num', x => x.slice().sort((a, b) => a - b)[1]);
  P.sum3Except = () => F('sum3x', 'Выход = a + b + c, но если все три числа равны — выход 0', 'nums', 'num', x => (x[0] === x[1] && x[1] === x[2] ? 0 : x[0] + x[1] + x[2]));
  P.sum3ExceptTwo = () => F('sum3x2', 'Выход = a + b + c, но если хотя бы два числа равны — выход 0', 'nums', 'num', x => (x[0] === x[1] || x[1] === x[2] || x[0] === x[2] ? 0 : x[0] + x[1] + x[2]));
  P.sum3AllEqA = () => F('sum3xa', 'Выход = a + b + c, но если все три равны — выход равен одному из них', 'nums', 'num', x => (x[0] === x[1] && x[1] === x[2] ? x[0] : x[0] + x[1] + x[2]));

  /* ---------- Подсчёт: цвета ---------- */
  P.countC = X => F('cnt' + X, `Выход — сколько шаров цвета ${q(X)}`, 'cols', 'num', a => O.count(a, c => c === X));
  P.countC2 = (X, Y) => F(`cnt${X}_${Y}`, `Выход — сколько шаров цвета ${q(X)} и ${q(Y)} вместе`, 'cols', 'num', a => O.count(a, c => c === X || c === Y));
  P.firstPos = X => F('fpos' + X, `Выход — номер первого шара цвета ${q(X)} (0, если его нет)`, 'cols', 'num', a => a.indexOf(X) + 1);
  P.distinct = () => F('distinct', 'Выход — сколько разных цветов во входе', 'cols', 'num', a => new Set(a).size);
  P.length = kind => F('len' + kind, `Выход — сколько всего ${kind === 'cols' ? 'шаров' : kind === 'shps' ? 'фигур' : 'букв'}`, kind, 'num', a => a.length);
  P.maxFreq = () => F('maxFreq', 'Выход — сколько раз встречается самый частый цвет', 'cols', 'num', a => Math.max(...O.freq(a).values()));
  P.runs = () => F('runs', 'Выход — число одноцветных групп подряд', 'cols', 'num', a => O.runs(a));
  P.evenC = X => F('even' + X, `Лампа горит, если шаров цвета ${q(X)} чётное число (ноль — тоже чётное)`, 'cols', 'bool', a => O.count(a, c => c === X) % 2 === 0);
  P.hasC = X => F('has' + X, `Лампа горит, если есть хотя бы один шар цвета ${q(X)}`, 'cols', 'bool', a => a.includes(X));
  P.atLeast2 = X => F('al2' + X, `Лампа горит, если шаров цвета ${q(X)} не меньше двух`, 'cols', 'bool', a => O.count(a, c => c === X) >= 2);
  P.lenEven = kind => F('lenEven' + kind, `Лампа горит, если ${kind === 'word' ? 'букв' : 'шаров'} чётное число`, kind, 'bool', a => a.length % 2 === 0);
  P.moreThan = (X, Y) => F(`more${X}_${Y}`, `Лампа горит, если шаров ${q(X)} больше, чем ${q(Y)}`, 'cols', 'bool', a => O.count(a, c => c === X) > O.count(a, c => c === Y));
  /* ---------- Смешение и замены ---------- */
  P.replace = (X, Y) => F(`rep${X}_${Y}`, `Каждый шар цвета ${q(X)} перекрашивается в ${q(Y)}`, 'cols', 'cols', a => a.map(c => (c === X ? Y : c)));
  P.swap = (X, Y) => F(`swap${X}_${Y}`, `Цвета ${q(X)} и ${q(Y)} меняются друг на друга`, 'cols', 'cols', a => a.map(c => (c === X ? Y : c === Y ? X : c)));
  P.replaceFirst = (X, Y) => F(`repF${X}_${Y}`, `Только первый шар цвета ${q(X)} перекрашивается в ${q(Y)}`, 'cols', 'cols', a => { const i = a.indexOf(X); const b = a.slice(); if (i >= 0) b[i] = Y; return b; });
  P.replaceExceptNear = (X, Y, Z) => F(`repN${X}_${Y}_${Z}`, `Каждый шар ${q(X)} перекрашивается в ${q(Y)} — кроме тех, что стоят вплотную к шару ${q(Z)}`, 'cols', 'cols', a => a.map((c, i) => (c === X && a[i - 1] !== Z && a[i + 1] !== Z ? Y : c)));
  P.replaceExceptEdges = (X, Y) => F(`repE${X}_${Y}`, `Шары ${q(X)} перекрашиваются в ${q(Y)}, кроме крайних`, 'cols', 'cols', a => a.map((c, i) => (c === X && i > 0 && i < a.length - 1 ? Y : c)));
  P.replaceUnlessHas = (X, Y, Z) => F(`repU${X}_${Y}_${Z}`, `Шары ${q(X)} перекрашиваются в ${q(Y)}, если во входе вообще нет ${q(Z)}`, 'cols', 'cols', a => (a.includes(Z) ? a.slice() : a.map(c => (c === X ? Y : c))));
  P.mixEnds = () => F('mixEnds', 'Выход — смесь первого и последнего шара по таблице красок', 'cols', 'col', a => mix(a[0], a[a.length - 1]));
  P.mixFirst2 = () => F('mixF2', 'Выход — смесь двух первых шаров', 'cols', 'col', a => mix(a[0], a[1]));
  P.firstCol = () => F('firstC', 'Выход — цвет первого шара', 'cols', 'col', a => a[0]);
  P.lastCol = () => F('lastC', 'Выход — цвет последнего шара', 'cols', 'col', a => a[a.length - 1]);
  P.mostFreq = left => F('mf' + (left ? 'L' : 'R'), `Выход — самый частый цвет; при равенстве побеждает тот, что встретился ${left ? 'раньше' : 'позже'}`, 'cols', 'col', a => {
    const m = O.freq(a), mx = Math.max(...m.values());
    if (left) return a.find(x => m.get(x) === mx);
    for (let i = a.length - 1; i >= 0; i--) if (m.get(a[i]) === mx) return a[i];
  });
  P.wheel = k => F('wh' + k, `Каждый цвет сдвигается на ${k} ${D.plural(k, 'шаг', 'шага', 'шагов')} по кругу К→О→Ж→З→С→Ф→К`, 'cols', 'cols', a => a.map(c => (c + k) % 6));
  P.wheelBack = k => F('whb' + k, `Каждый цвет сдвигается на ${k} ${D.plural(k, 'шаг', 'шага', 'шагов')} назад по кругу К←О←Ж←З←С←Ф`, 'cols', 'cols', a => a.map(c => O.mod(c - k, 6)));
  P.wheelWarm = k => F('whw' + k, `Только тёплые цвета (К, О, Ж) сдвигаются на ${k} по кругу`, 'cols', 'cols', a => a.map(c => (c < 3 ? (c + k) % 6 : c)));
  P.mixAdj = () => F('mixAdj', 'Каждые два соседних шара смешиваются; выход на один шар короче', 'cols', 'cols', a => a.slice(1).map((c, i) => mix(a[i], c)));
  P.mixAdjRev = () => F('mixAdjR', 'Соседние шары смешиваются, и ряд разворачивается', 'cols', 'cols', a => a.slice(1).map((c, i) => mix(a[i], c)).reverse());
  P.mixPairs = () => F('mixPairs', 'Шары смешиваются парами 1+2, 3+4…; непарный последний остаётся', 'cols', 'cols', a => { const o = []; for (let i = 0; i < a.length; i += 2) o.push(i + 1 < a.length ? mix(a[i], a[i + 1]) : a[i]); return o; });
  P.mixFirstEach = () => F('mixFE', 'Первый шар смешивается с каждым из остальных', 'cols', 'cols', a => a.slice(1).map(c => mix(a[0], c)));

  /* ---------- Порядок и позиция (общие для шаров, фигур, букв) ---------- */
  P.rev = kind => F('rev' + kind, `Ряд разворачивается задом наперёд`, kind, kind, a => O.rev(a));
  P.rotL = (kind, k) => F(`rotL${kind}${k}`, `Циклический сдвиг влево на ${k}: ${k === 1 ? 'первый элемент уходит' : 'первые ' + k + ' уходят'} в конец`, kind, kind, a => O.rotL(a, k));
  P.rotR = (kind, k) => F(`rotR${kind}${k}`, `Циклический сдвиг вправо на ${k}: ${k === 1 ? 'последний элемент переходит' : 'последние ' + k + ' переходят'} в начало`, kind, kind, a => O.rotL(a, -k));
  P.swapEnds = kind => F('swapE' + kind, 'Первый и последний элементы меняются местами', kind, kind, a => { const b = a.slice(); [b[0], b[b.length - 1]] = [b[b.length - 1], b[0]]; return b; });
  P.every2 = (kind, s) => F(`ev2${kind}${s}`, s === 0 ? 'Остаются только элементы на нечётных местах: 1-й, 3-й, 5-й' : 'Остаются только элементы на чётных местах: 2-й, 4-й', kind, kind, a => a.filter((_, i) => i % 2 === s));
  P.firstHalf = kind => F('half' + kind, 'Остаётся первая половина ряда (с округлением вверх)', kind, kind, a => a.slice(0, Math.ceil(a.length / 2)));
  P.dedupe = kind => F('dedupe' + kind, 'Повторы удаляются — остаётся первое появление каждого элемента', kind, kind, a => a.filter((x, i) => a.indexOf(x) === i));
  P.sortCols = () => F('sortC', 'Шары сортируются по кругу цветов: К, О, Ж, З, С, Ф', 'cols', 'cols', a => a.slice().sort((x, y) => x - y));
  /* ---------- Фигуры ---------- */
  const attrSortDesc = { f: 'по форме (круг → квадрат → треугольник)', c: 'по цвету (красный → синий → жёлтый)', s: 'по размеру' };
  P.sortBy = (p, desc) => F(`sort${p}${desc ? 'D' : ''}`, `Фигуры сортируются ${attrSortDesc[p]}${p === 's' ? (desc ? ': большие впереди' : ': малые впереди') : desc ? ' в обратном порядке' : ''}; при равенстве порядок сохраняется`, 'shps', 'shps', a => O.sortBy(a, x => (desc ? -attr(x, p) : attr(x, p))));
  P.smallFrontRev = () => F('smallFR', 'Малые фигуры уходят вперёд в обратном порядке, большие — за ними', 'shps', 'shps', a => O.rev(a.filter(x => !D.ss(x))).concat(a.filter(x => D.ss(x))));
  P.endsMatch = p => F('endsM' + p, `Лампа горит, если у первой и последней фигуры одинаковый признак «${ATTR_N[p]}»`, 'shps', 'bool', a => attr(a[0], p) === attr(a[a.length - 1], p));
  P.firstSecondMatch = p => F('fsM' + p, `Лампа горит, если у первой и второй фигуры одинаковый признак «${ATTR_N[p]}»`, 'shps', 'bool', a => attr(a[0], p) === attr(a[1], p));
  P.adjMatch = p => F('adjM' + p, `Лампа горит, если есть две соседние фигуры с одинаковым признаком «${ATTR_N[p]}»`, 'shps', 'bool', a => a.slice(1).some((x, i) => attr(x, p) === attr(a[i], p)));
  const byColor = a => O.sortBy(a, x => D.sc(x));
  P.condFirstCircle = () => F('cfc', 'Если первая фигура — круг, фигуры сортируются по цвету (красный → синий → жёлтый), иначе ряд разворачивается', 'shps', 'shps', a => (D.sf(a[0]) === 0 ? byColor(a) : O.rev(a)));
  P.condLastCircle = () => F('clc', 'Если последняя фигура — круг, сортировка по цвету, иначе разворот', 'shps', 'shps', a => (D.sf(a[a.length - 1]) === 0 ? byColor(a) : O.rev(a)));
  P.condAnyCircle = () => F('cac', 'Если в ряду есть круг, сортировка по цвету, иначе разворот', 'shps', 'shps', a => (a.some(x => D.sf(x) === 0) ? byColor(a) : O.rev(a)));
  P.countMatchFirst = p => F('cmf' + p, `Выход — сколько фигур совпадают с первой по признаку «${ATTR_N[p]}» (включая её саму)`, 'shps', 'num', a => O.count(a, x => attr(x, p) === attr(a[0], p)));
  P.countMatchFirstEx = p => F('cmfx' + p, `Выход — сколько фигур, кроме первой, совпадают с ней по признаку «${ATTR_N[p]}»`, 'shps', 'num', a => O.count(a.slice(1), x => attr(x, p) === attr(a[0], p)));
  P.countMatchLast = p => F('cml' + p, `Выход — сколько фигур совпадают с последней по признаку «${ATTR_N[p]}»`, 'shps', 'num', a => O.count(a, x => attr(x, p) === attr(a[a.length - 1], p)));
  P.countAttr = (p, v, label) => F(`ca${p}${v}`, `Выход — сколько фигур: ${label}`, 'shps', 'num', a => O.count(a, x => attr(x, p) === v));
  P.sortSizeRedFixed = () => F('ssrf', 'Фигуры сортируются по размеру (малые впереди), но красные фигуры остаются на своих местах', 'shps', 'shps', a => {
    const idx = [], items = [];
    a.forEach((x, i) => { if (D.sc(x) !== 0) { idx.push(i); items.push(x); } });
    const sorted = O.sortBy(items, x => D.ss(x)), b = a.slice();
    idx.forEach((i, j) => { b[i] = sorted[j]; });
    return b;
  });
  P.redFront = () => F('redF', `Красные фигуры переезжают в начало ряда, остальные сохраняют порядок`, 'shps', 'shps', a => O.sortBy(a, x => (D.sc(x) === 0 ? 0 : 1)));

  /* ---------- Геометрия сетки ---------- */
  P.flipH = () => F('flipH', 'Сетка отражается слева направо, как в зеркале', 'grid', 'grid', G.flipH);
  P.flipV = () => F('flipV', 'Сетка отражается сверху вниз', 'grid', 'grid', G.flipV);
  P.transpose = () => F('transp', 'Сетка отражается по главной диагонали: строки становятся столбцами', 'grid', 'grid', G.transpose);
  P.antiT = () => F('antiT', 'Сетка отражается по побочной диагонали', 'grid', 'grid', G.antiT);
  P.rotCW = () => F('rotCW', 'Сетка поворачивается на 90° по часовой стрелке', 'grid', 'grid', G.rotCW);
  P.rotCCW = () => F('rotCCW', 'Сетка поворачивается на 90° против часовой стрелки', 'grid', 'grid', G.rotCCW);
  P.rot180 = () => F('rot180', 'Сетка поворачивается на 180°', 'grid', 'grid', G.rot180);
  P.invert = () => F('inv', 'Все клетки инвертируются: включённые гаснут, выключенные загораются', 'grid', 'grid', G.invert);
  P.invertExceptCenter = () => F('invXC', 'Все клетки инвертируются, кроме центральной', 'grid', 'grid', g => { const n = O.gn(g), m = (n * n - 1) / 2; return g.map((x, i) => (n % 2 && i === m ? x : 1 - x)); });
  P.invertBorder = () => F('invB', 'Инвертируется только внешняя рамка сетки', 'grid', 'grid', g => O.gmap(g, (r, c, n) => (r === 0 || c === 0 || r === n - 1 || c === n - 1 ? 1 - O.at(g, n, r, c) : O.at(g, n, r, c))));
  P.invFlipH = () => F('invFH', 'Сетка отражается слева направо и инвертируется', 'grid', 'grid', g => G.invert(G.flipH(g)));
  P.parityOn = () => F('parOn', 'Лампа горит, если включённых клеток нечётное число', 'grid', 'bool', g => O.sum(g) % 2 === 1);
  P.countGt = k => F('cgt' + k, `Лампа горит, если включено больше ${k} клеток`, 'grid', 'bool', g => O.sum(g) > k);
  P.centerOn = () => F('ctrOn', 'Лампа горит, если включена центральная клетка', 'grid', 'bool', g => g[(g.length - 1) / 2] === 1);
  P.firstRowOdd = () => F('fro', 'Лампа горит, если в верхней строке включено нечётное число клеток', 'grid', 'bool', g => O.sum(g.slice(0, O.gn(g))) % 2 === 1);
  P.symHB = () => F('symHB', 'Лампа горит, если узор симметричен слева направо', 'grid', 'bool', G.symH);
  P.cornersOn = () => F('corn', 'Лампа горит, если включён хотя бы один угол', 'grid', 'bool', g => { const n = O.gn(g); return !!(g[0] || g[n - 1] || g[n * n - n] || g[n * n - 1]); });
  const dirName = { '0,1': 'вправо', '0,-1': 'влево', '1,0': 'вниз', '-1,0': 'вверх' };
  P.shift = (dr, dc, wrap) => F(`sh${dr}${dc}${wrap ? 'w' : ''}`, `Весь узор сдвигается на одну клетку ${dirName[dr + ',' + dc]}${wrap ? '; вышедшее за край появляется с другой стороны' : '; вышедшее за край пропадает'}`, 'grid', 'grid', g => G.shift(g, dr, dc, wrap));
  P.life = (B, S, torus) => F(`life${B.join('')}_${S.join('')}${torus ? 't' : ''}`, `Один шаг клеточного автомата: пустая клетка загорается при ${B.join(' или ')} соседях, горящая выживает при ${S.join(' или ')} (считаются 8 соседей${torus ? ', края склеены' : ', за краем пусто'})`, 'grid', 'grid', g => G.life(g, B, S, torus));
  P.exactNbrs = (k, eight) => F(`exN${k}${eight ? 'e' : ''}`, `Клетка горит, если ровно ${k} ${D.plural(k, 'её сосед', 'её соседа', 'её соседей')} ${eight ? 'из восьми (с диагоналями)' : 'сверху, снизу, слева или справа'} включены`, 'grid', 'grid', g => O.gmap(g, (r, c, n) => (O.nbrs(g, n, r, c, eight, false) === k ? 1 : 0)));
  P.atLeastNbrs = (k, eight) => F(`alN${k}${eight ? 'e' : ''}`, `Клетка горит, если включено не меньше ${k} её соседей ${eight ? 'из восьми' : 'по сторонам'}`, 'grid', 'grid', g => O.gmap(g, (r, c, n) => (O.nbrs(g, n, r, c, eight, false) >= k ? 1 : 0)));
  P.invertUnlessSymH = () => F('invUSH', 'Сетка инвертируется — но если узор симметричен слева направо, он проходит без изменений', 'grid', 'grid', g => (G.symH(g) ? g.slice() : G.invert(g)));
  P.invertUnlessSymV = () => F('invUSV', 'Сетка инвертируется, но симметричный сверху вниз узор не меняется', 'grid', 'grid', g => (G.symV(g) ? g.slice() : G.invert(g)));

  /* ---------- Слова ---------- */
  const vc = a => O.count(a, isVowel);
  P.vowelEven = () => F('vEven', 'Считаются гласные (А, О, У); лампа горит, если их чётное число (ноль — тоже чётное)', 'word', 'bool', a => vc(a) % 2 === 0);
  P.consEven = () => F('cEven', 'Лампа горит, если согласных чётное число', 'word', 'bool', a => (a.length - vc(a)) % 2 === 0);
  P.moreVowels = () => F('moreV', 'Лампа горит, если гласных больше, чем согласных', 'word', 'bool', a => vc(a) > a.length - vc(a));
  P.startsVowel = () => F('startV', 'Лампа горит, если слово начинается с гласной', 'word', 'bool', a => isVowel(a[0]));
  P.rotByVowels = () => F('rotV', 'Слово циклически сдвигается влево на столько букв, сколько в нём гласных', 'word', 'word', a => O.rotL(a, vc(a)));
  P.rotByCons = () => F('rotCn', 'Слово сдвигается влево на число согласных', 'word', 'word', a => O.rotL(a, a.length - vc(a)));
  const vcycle = a => a.map(i => (i < 3 ? (i + 1) % 3 : i));
  P.vowelCycle = () => F('vCyc', 'Гласные меняются по кругу: А→О, О→У, У→А', 'word', 'word', vcycle);
  P.revCycle = () => F('revCyc', 'Слово разворачивается, затем гласные меняются по кругу А→О→У→А', 'word', 'word', a => vcycle(O.rev(a)));
  P.revCycleExcept = () => F('revCycX', 'Слово разворачивается, затем гласные меняются по кругу А→О→У→А. Исключение: если первая и последняя буквы совпадают, разворота нет — меняются только гласные', 'word', 'word', a => (a[0] === a[a.length - 1] ? vcycle(a) : vcycle(O.rev(a))));
  P.revCycleExceptFV = () => F('revCycXV', 'Разворот и смена гласных, но если слово начинается с гласной — без разворота', 'word', 'word', a => (isVowel(a[0]) ? vcycle(a) : vcycle(O.rev(a))));

  /* ---------- Память ---------- */
  P.runSum = () => M('runSum', 'Машина копит сумму всех чисел с момента сброса и выдаёт её', 'nums', 'num', () => 0, (x, s) => [s + x[0], s + x[0]]);
  P.sumLast2 = () => M('sumL2', 'Выход — сумма текущего и предыдущего числа', 'nums', 'num', () => 0, (x, p) => [x[0] + p, x[0]]);
  P.prevPlus = () => M('prevPlus', 'Выход — текущее число плюс предыдущее (после сброса предыдущее считается нулём)', 'nums', 'num', () => 0, (x, p) => [x[0] + p, x[0]]);
  P.plusIndex = () => M('plusIdx', 'Выход — число плюс номер запуска после сброса (1, 2, 3…)', 'nums', 'num', () => 0, (x, k) => [x[0] + k + 1, k + 1]);
  P.plusPrevRuns = () => M('plusPrev', 'Выход — число плюс количество предыдущих запусков после сброса (0, 1, 2…)', 'nums', 'num', () => 0, (x, k) => [x[0] + k, k + 1]);
  P.mulIndex = () => M('mulIdx', 'Выход — число, умноженное на номер запуска после сброса', 'nums', 'num', () => 0, (x, k) => [x[0] * (k + 1), k + 1]);
  P.runSumMod = m => M('runSumMod' + m, `Накопленная сумма, от которой берётся остаток от деления на ${m}`, 'nums', 'num', () => 0, (x, s) => [O.mod(s + x[0], m), s + x[0]]);
  P.absDiffPrev = () => M('adPrev', 'Выход — разность текущего и предыдущего числа по модулю', 'nums', 'num', () => 0, (x, p) => [Math.abs(x[0] - p), x[0]]);
  P.maxPrev = () => M('maxPrev', 'Выход — большее из текущего и предыдущего числа', 'nums', 'num', () => 0, (x, p) => [Math.max(x[0], p), x[0]]);
  P.runSumZeroReset = () => M('rsZero', 'Машина копит сумму чисел с момента сброса. Исключение: ноль обнуляет накопленное', 'nums', 'num', () => 0, (x, s) => { const v = x[0] === 0 ? 0 : s + x[0]; return [v, v]; });
  P.zeroDoubles = () => M('rsZeroDbl', 'Накопленная сумма, но ноль удваивает накопленное', 'nums', 'num', () => 0, (x, s) => { const v = x[0] === 0 ? s * 2 : s + x[0]; return [v, v]; });
  P.toggleOn = X => M('tog' + X, `Лампа-переключатель: каждый шар ${q(X)} меняет её состояние (после сброса лампа погашена)`, 'cols', 'bool', () => false, (x, s) => { const v = x[0] === X ? !s : s; return [v, v]; });
  P.lastWas = X => M('lastW' + X, `Лампа горит, если последний шар — ${q(X)}`, 'cols', 'bool', () => 0, (x) => [x[0] === X, 0]);
  P.everX = X => M('ever' + X, `Лампа загорается, когда приходит ${q(X)}, и горит до сброса`, 'cols', 'bool', () => false, (x, s) => { const v = s || x[0] === X; return [v, v]; });
  P.toggleEach = () => M('togAll', 'Лампа меняет состояние при каждом запуске', 'cols', 'bool', () => false, (x, s) => [!s, !s]);
  const common = (a, b) => new Set(a.filter(x => b.includes(x))).size;
  P.commonWithPrev = () => M('comPrev', 'Выход — сколько разных букв нового слова встречались в предыдущем слове (после сброса предыдущего нет)', 'word', 'num', () => [], (x, p) => [common(x, p), x]);
  P.posMatchPrev = () => M('posPrev', 'Выход — сколько позиций совпадают с предыдущим словом', 'word', 'num', () => [], (x, p) => [O.count(x, (c, i) => p[i] === c), x]);
  P.commonWithFirst = () => M('comFirst', 'Выход — сколько разных букв слова встречались в первом слове после сброса', 'word', 'num', () => null, (x, f) => (f === null ? [0, x] : [common(x, f), f]));
  P.lenPrev = () => M('lenPrev', 'Выход — длина предыдущего слова', 'word', 'num', () => 0, (x, l) => [l, x.length]);
  P.runMax = () => M('runMax', 'Выход — наибольшее из всех чисел, поданных после сброса', 'nums', 'num', () => -1, (x, m) => { const v = Math.max(m, x[0], x[1]); return [v, v]; });
  P.maxCurPrevPair = () => M('maxCP', 'Выход — наибольшее число из текущей и предыдущей пары', 'nums', 'num', () => -1, (x, m) => [Math.max(m, x[0], x[1]), Math.max(x[0], x[1])]);
  P.maxCur = () => M('maxCur', 'Выход — большее число текущей пары', 'nums', 'num', () => 0, (x) => [Math.max(x[0], x[1]), 0]);
  P.runMin = () => M('runMin', 'Выход — наименьшее из всех чисел после сброса', 'nums', 'num', () => Infinity, (x, m) => { const v = Math.min(m, x[0], x[1]); return [v, v]; });
  const zero = g => g.map(() => 0);
  P.xorPrev = () => M('xorPrev', 'Клетка горит, если она различается в текущей и предыдущей сетке (после сброса предыдущая пуста)', 'grid', 'grid', () => null, (g, p) => [g.map((v, i) => v ^ (p ? p[i] : 0)), g]);
  P.orPrev = () => M('orPrev', 'Клетка горит, если горела в текущей или предыдущей сетке', 'grid', 'grid', () => null, (g, p) => [g.map((v, i) => v | (p ? p[i] : 0)), g]);

      const [a, b] = r.shuffle(ops); return { rule: compose(a, b), twins: [a, b, compose(b, a), compose(a, P.rev('cols'))], feat: 'Два действия над шарами подряд.' };
    } },
    { in: SHPS(3, 5), fam: 'combo', make(r) {
      const ops = [P.rev('shps'), P.rotL('shps', 1), P.rotR('shps', 1), P.sortBy('s', false), P.sortBy('f', false), P.sortBy('c', true), P.every2('shps', 0), P.swapEnds('shps'), P.redFront()];

  /* ---------- Выборка входов ---------- */
  function sampleIn(spec, r) {
    switch (spec.type) {

      case 'cols': return randCols(r, r.int(spec.minLen, spec.maxLen));

    Object.assign(L, b);
    L.stateful = L.rule.stateful;

    if (n >= 4 && r.chance(0.4)) { const g = r.pick(RANDOM_GENS); return assemble(g, seed, { mode: 'endless', n, base, w: 5 }); }
    const idx = r.int(3, DEFS.length - 1);
    return assemble(DEFS[idx], seed, { mode: 'endless', n, base, idx, w: DEFS[idx].w });
  }

  /* ---------- Пул гипотез: двойники, примитивы той же сигнатуры, правила других уровней ---------- */
  function sweeps(sig) {
    const out = [], c6 = [0, 1, 2, 3, 4, 5], push = (...a) => out.push(...a);
    switch (sig) {
      case 'nums|1||num|s':
        for (let a = 1; a <= 9; a++) push(P.add(a));
        for (let k = 2; k <= 5; k++) push(P.mul(k));
        for (let m = 2; m <= 9; m++) push(P.mod(m));
        for (let m = 2; m <= 5; m++) push(P.div(m));
        for (let b = 1; b <= 4; b++) push(P.lin(2, b), P.lin(3, b), P.linIn(2, b));
        push(P.digitSum(), P.maxDigit(), P.digitDiff(), P.square());
        break;
      case 'nums|2||num|s': push(P.max2(), P.min2(), P.first(), P.second(), P.absDiff(), P.posDiff(), P.sum2(), P.sumMod10()); break;
      case 'nums|3||num|s': push(P.sum3(), P.max3(), P.min3(), P.median3(), P.sum3Except(), P.sum3ExceptTwo()); break;
      case 'cols|||num|s': c6.forEach(x => push(P.countC(x), P.firstPos(x))); push(P.distinct(), P.length('cols'), P.maxFreq(), P.runs()); break;
      case 'cols|||bool|s': c6.forEach(x => push(P.evenC(x), P.hasC(x), P.atLeast2(x))); push(P.lenEven('cols')); break;
      case 'cols|||col|s': push(P.firstCol(), P.lastCol(), P.mixEnds(), P.mixFirst2(), P.mostFreq(true), P.mostFreq(false)); break;
      case 'cols|||cols|s':
        c6.forEach(x => c6.forEach(y => { if (x !== y) push(P.replace(x, y)); }));
        push(P.rev('cols'), P.rotL('cols', 1), P.rotR('cols', 1), P.wheel(1), P.wheel(2), P.wheelBack(1), P.wheelBack(2), P.mixAdj(), P.sortCols(), P.swapEnds('cols'));
        break;
      case 'shps|||shps|s':
        push(P.rev('shps'), P.rotL('shps', 1), P.rotL('shps', 2), P.rotR('shps', 1), P.rotR('shps', 2), P.every2('shps', 0), P.every2('shps', 1), P.swapEnds('shps'), P.firstHalf('shps'), P.dedupe('shps'), P.redFront());
        ['f', 'c', 's'].forEach(p => push(P.sortBy(p, false), P.sortBy(p, true)));
        break;
      case 'shps|||bool|s': ['f', 'c', 's'].forEach(p => push(P.endsMatch(p), P.firstSecondMatch(p), P.adjMatch(p))); break;
      case 'shps|||num|s':
        ['f', 'c', 's'].forEach(p => push(P.countMatchFirst(p), P.countMatchLast(p), P.countMatchFirstEx(p)));
        push(P.countAttr('s', 1, 'большие'), P.countAttr('f', 0, 'круги'), P.countAttr('c', 0, 'красные'), P.length('shps'));
        break;
      case 'grid||3|grid|s': case 'grid||4|grid|s': {
        const sy = [P.flipH(), P.flipV(), P.transpose(), P.antiT(), P.rotCW(), P.rotCCW(), P.rot180()];
        push(...sy, P.invert());
        sy.forEach(s => push(compose(s, P.invert())));
        [[0, 1], [0, -1], [1, 0], [-1, 0]].forEach(([a, b]) => push(P.shift(a, b, true), P.shift(a, b, false)));
        push(P.invertExceptCenter(), P.invertBorder());
        if (sig.includes('|3|')) { [1, 2, 3].forEach(k => push(P.exactNbrs(k, false), P.exactNbrs(k, true), P.atLeastNbrs(k, false))); }
        else push(P.life([3], [2, 3], false), P.life([3], [2, 3], true), P.life([3, 6], [2, 3], false), P.life([2], [], false));
        break;
      }
      case 'grid||3|bool|s': push(P.parityOn(), P.countGt(3), P.countGt(4), P.countGt(5), P.centerOn(), P.firstRowOdd(), P.symHB(), P.cornersOn()); break;
      case 'word|||bool|s': push(P.vowelEven(), P.consEven(), P.lenEven('word'), P.moreVowels(), P.startsVowel()); break;
      case 'word|||word|s': push(P.rev('word'), P.rotL('word', 1), P.rotL('word', 2), P.rotR('word', 1), P.vowelCycle(), P.revCycle(), P.rotByVowels(), P.rotByCons(), P.swapEnds('word'), P.dedupe('word')); break;
      case 'nums|1||num|m': push(P.runSum(), P.sumLast2(), P.plusIndex(), P.plusPrevRuns(), P.mulIndex(), P.runSumMod(10), P.absDiffPrev(), P.maxPrev(), P.runSumZeroReset(), P.zeroDoubles()); break;
      case 'nums|2||num|m': push(P.runMax(), P.runMin(), P.maxCur(), P.maxCurPrevPair()); break;
      case 'cols|||bool|m': c6.forEach(x => push(P.toggleOn(x), P.lastWas(x), P.everX(x))); push(P.toggleEach()); break;
      case 'word|||num|m': push(P.commonWithPrev(), P.posMatchPrev(), P.commonWithFirst(), P.lenPrev()); break;

  const sigCache = new Map();
  function sharedPool(sig) {
    if (sigCache.has(sig)) return sigCache.get(sig);

      const L = assemble(def, campaignSeed(i), {});
      if (L.sig === sig) arr.push(L.rule, ...L.twins);
