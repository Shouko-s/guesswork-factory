    return arr;
  }
  function poolFor(L) {
    if (!L._pool) L._pool = L.twins.concat(sharedPool(L.sig)).filter(h => h !== L.rule);
    return L._pool;
  }

  return { WORLDS, DEFS, FAM, campaign, daily, endless, dateKey, sampleIn, randHist, poolFor, assemble, campaignSeed };
})();

/* =====================================================================
   МОДУЛЬ 5. ПОДБОР ЭКЗАМЕНА, ЦЕЛЬ УРОВНЯ, ПОДСКАЗКА-ЭКСПЕРИМЕНТ, САМОПРОВЕРКА
   ===================================================================== */
const Exam = (() => {
  const { key } = D;
  /* Кандидаты: случайные истории + «особые» входы уровня. */
  function candidates(L, r, n) {
    const out = [], seen = new Set();
    let tries = 0;
    while (out.length < n && tries < n * 6) {
      tries++;
      const h = L.def.special && r.next() < 0.3 ? L.def.special(r, L) : Levels.randHist(L, r);
      const k = key(h);
      if (seen.has(k)) continue;
      seen.add(k); out.push(h);
    }
    return out;
  }
  const safeRun = (rule, h) => { try { return key(rule.run(h)); } catch (e) { return '!err'; } };
  const consistentWith = (rule, journal) => journal.every(e => safeRun(rule, e.hist) === key(e.out));

  /* Экзамен: перебором выбираем входы, на которых настоящее правило расходится
     с двойниками и с гипотезами, совместимыми с журналом. */
  function build(L, journal, attempt, usedKeys) {
    const r = RNG.make(RNG.hash('exam', L.seed, attempt));
    const T = L.rule, Q = T.outType === 'bool' ? 5 : 3;
    const banned = new Set(usedKeys || []);
    journal.forEach(e => banned.add(key(e.hist)));
    const all = candidates(L, r, 420);
    let cands = all.filter(h => !banned.has(key(h)));
    if (cands.length < Q * 2) cands = all.filter(h => !(usedKeys || []).includes(key(h)));
    if (cands.length < Q) cands = all;
    const tK = cands.map(h => key(T.run(h)));
    const twins = L.twins;
    const twinDiff = twins.map(tw => cands.map((h, i) => safeRun(tw, h) !== tK[i]));
    const cons = Levels.poolFor(L).filter(h => !twins.includes(h) && consistentWith(h, journal));
    const consDiff = cons.map(h => cands.map((c, i) => safeRun(h, c) !== tK[i])).filter(v => v.some(Boolean));
    const chosen = [], covT = twins.map(() => false), covC = consDiff.map(() => false);
    for (let qn = 0; qn < Q && qn < cands.length; qn++) {
      let best = -1, bs = -Infinity;
      for (let i = 0; i < cands.length; i++) {
        if (chosen.includes(i)) continue;
        let s = r.next() * 0.9;
        for (let t = 0; t < twins.length; t++) if (twinDiff[t][i]) s += covT[t] ? 2 : 100;
        for (let c = 0; c < consDiff.length; c++) if (consDiff[c][i]) s += covC[c] ? 0.4 : 4;
        if (T.outType === 'bool') {
          const yes = chosen.filter(j => tK[j] === 'true').length, no = chosen.length - yes;
          if (tK[i] === 'true' && yes > no) s -= 6;
          if (tK[i] === 'false' && no > yes) s -= 6;
        } else if (chosen.some(j => tK[j] === tK[i])) s -= 3;
        if (s > bs) { bs = s; best = i; }
      }
      chosen.push(best);
      twinDiff.forEach((v, t) => { if (v[best]) covT[t] = true; });
      consDiff.forEach((v, c) => { if (v[best]) covC[c] = true; });
    }
    return {
      qs: chosen.map(i => ({ hist: cands[i], out: T.run(cands[i]) })),
      allTwins: covT.every(Boolean),
      uncovered: twins.filter((_, t) => !covT[t]).map(t => t.id),
    };
  }

  /* Цель: жадно подбираем различающие входы, пока не отделим правило
     от всех двойников и от правил той же сигнатуры. */
  function target(L) {
    if (L._target) return L._target;
    const r = RNG.make(RNG.hash('target', L.seed));
    const cands = candidates(L, r, 500);
    const tK = cands.map(h => key(L.rule.run(h)));
    const twinVecs = L.twins.map(tw => cands.map((h, i) => safeRun(tw, h) !== tK[i]));
    const finite = twinVecs.every(v => v.some(Boolean));
    const seen = new Set(), vecs = [];
    const addVec = v => { if (!v.some(Boolean)) return; const k = v.map(b => (b ? 1 : 0)).join(''); if (seen.has(k)) return; seen.add(k); vecs.push(v); };
    twinVecs.forEach(addVec);
    Levels.poolFor(L).forEach(h => addVec(cands.map((c, i) => safeRun(h, c) !== tK[i])));
    /* Внимательный игрок не знает правила: на каждом шаге он выбирает вход,
       который лучше всего делит ещё возможные гипотезы (минимакс по группам),
       смотрит настоящий выход и отбрасывает несовместимые. */
    const hyps = [L.rule].concat(L.twins, Levels.poolFor(L));
    const outs = hyps.map(h => cands.map(c => safeRun(h, c)));
    const tVec = tK.join('\u0001');
    let alive = hyps.map((_, i) => i).filter(i => i === 0 || outs[i].join('\u0001') !== tVec);
    const seenH = new Set();
    alive = alive.filter(i => { const k = outs[i].join('\u0001'); if (seenH.has(k)) return false; seenH.add(k); return true; });
    let picks = 0;
    const used = new Set();
    while (alive.length > 1 && picks < 40) {
      let best = -1, bs = Infinity;
      for (let i = 0; i < cands.length; i++) {
        if (used.has(i)) continue;
        const g = new Map();
        for (const a of alive) g.set(outs[a][i], (g.get(outs[a][i]) || 0) + 1);
        const worst = Math.max(...g.values());
        if (worst < bs) { bs = worst; best = i; }
      }
      if (best < 0 || bs === alive.length) break;
      used.add(best);
      alive = alive.filter(a => outs[a][best] === tK[best]);
      picks++;
    }
    const remaining = alive.filter(a => a !== 0);
    const value = Math.max(L.tut ? 2 : 3, picks + 1 + (L.stateful ? 1 : 0)) + (L.boss ? 2 : 0);
    L._target = { value, finite: finite && remaining.length === 0, picks };
    return L._target;
  }

  /* Подсказка №2: эксперимент, который лучше всего делит оставшиеся гипотезы. */
  function suggest(L, journal) {
    const r = RNG.make(RNG.hash('hint', L.seed, journal.length));
    const banned = new Set(journal.map(e => key(e.hist)));
    let cands = candidates(L, r, 300).filter(h => !banned.has(key(h)));
    if (!cands.length) cands = candidates(L, r, 50);
    const hyps = [L.rule].concat(L.twins, Levels.poolFor(L)).filter(h => consistentWith(h, journal));
    let best = cands[0], bs = Infinity;
    for (const h of cands) {
      const groups = new Map();
      for (const hy of hyps) { const k = safeRun(hy, h); groups.set(k, (groups.get(k) || 0) + 1); }
      const tGroup = groups.get(key(L.rule.run(h)));
      const twinsSplit = L.twins.filter(tw => safeRun(tw, h) !== key(L.rule.run(h))).length;
      const s = Math.max(...groups.values()) + tGroup * 0.5 - twinsSplit * 2 + r.next() * 0.3;
      if (s < bs) { bs = s; best = h; }
    }
    return best;
  }

  /* Проверка корректности выхода по типу. */
  function validOut(type, v, L) {
    const isInt = x => Number.isInteger(x);
    switch (type) {
      case 'num': return isInt(v) && Math.abs(v) < 100000;
      case 'col': return isInt(v) && v >= 0 && v <= 6;
      case 'cols': return Array.isArray(v) && v.length >= 1 && v.length <= 8 && v.every(c => isInt(c) && c >= 0 && c <= 6);
      case 'shps': return Array.isArray(v) && v.length >= 1 && v.every(c => isInt(c) && c >= 0 && c <= 17);
      case 'grid': return Array.isArray(v) && v.length === L.inSpec.n * L.inSpec.n && v.every(c => c === 0 || c === 1);
      case 'bool': return typeof v === 'boolean';
      case 'word': return Array.isArray(v) && v.length >= 1 && v.every(c => isInt(c) && c >= 0 && c <= 5);
    }
    return false;
  }

  /* Самопроверка всех 48 уровней. */
  function selfTest() {
    const report = [];
    for (let i = 0; i < Levels.DEFS.length; i++) {
      const errs = [];
      let L;
      try { L = Levels.campaign(i); } catch (e) { report.push({ i, ok: false, errs: ['сборка: ' + e.message] }); continue; }
      const r = RNG.make(RNG.hash('selftest', i));
      for (let k = 0; k < 500; k++) {
        const h = Levels.randHist(L, r);
        try {
          const o = L.rule.run(h);
          if (!validOut(L.rule.outType, o, L)) { errs.push('некорректный выход на ' + key(h) + ': ' + key(o)); break; }
          if (key(o) !== key(L.rule.run(h))) { errs.push('недетерминированный выход'); break; }
          L.twins.forEach(tw => { const t = tw.run(h); if (!validOut(tw.outType, t, L)) throw new Error('двойник ' + tw.id + ' дал ' + key(t)); });
        } catch (e) { errs.push('ошибка на ' + key(h) + ': ' + e.message); break; }
      }
      if (L.twins.length < 2) errs.push('мало двойников');
      L.twins.forEach(tw => { if (tw.outType !== L.rule.outType) errs.push('тип двойника ' + tw.id); });
      const t = target(L);
      if (!t.finite || !Number.isFinite(t.value)) errs.push('цель бесконечна');
      for (let a = 0; a < 3; a++) {
        const ex = build(L, [], a, []);
        if (!ex.allTwins) errs.push(`экзамен #${a + 1} не отличает: ${ex.uncovered.join(', ')}`);
        if (ex.qs.length !== (L.rule.outType === 'bool' ? 5 : 3)) errs.push('число вопросов');
      }
      report.push({ i, ok: errs.length === 0, errs, target: t.value, rule: L.rule.desc, twins: L.twins.length });
    }
    return report;
  }

  return { build, target, suggest, selfTest, validOut, consistentWith, candidates };
})();

if (typeof module !== 'undefined') module.exports = { RNG, D, Rules, Levels, Exam };

/* =====================================================================

/* =====================================================================
   МОДУЛЬ 7. ЗВУК (Web Audio API, включается после первого действия игрока)
   ===================================================================== */
const Snd = (() => {
  let ctx = null, master = null, ready = false, muted = false, noiseBuf = null;
  function ensure() {
    if (!ready || muted) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination); } catch (e) { return null; }
    }

  }

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);

  }

    const t = c.currentTime + at, osc = c.createOscillator(), g = c.createGain();

    osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + attack + dur + 0.05);
  }
  function noise(o = {}) {
    const c = ensure(); if (!c) return;
    const { dur = 0.2, vol = 0.15, type = 'bandpass', freq = 1200, q = 1, at = 0, attack = 0.005, slide = null } = o;
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t = c.currentTime + at, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = noiseBuf; src.loop = true;
    f.type = type; f.frequency.setValueAtTime(freq, t); if (slide) f.frequency.exponentialRampToValueAtTime(slide, t + attack + dur); f.Q.value = q;
    env(g, t, attack, vol, dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + attack + dur + 0.05);
  }
  return {
    unlock() { ready = true; ensure(); },
    setMuted(m) { muted = !!m; if (ctx && muted) ctx.suspend(); else if (ctx && ready) ctx.resume(); },
    get muted() { return muted; },
    click() { tone(2100, { type: 'square', dur: 0.022, vol: 0.04 }); noise({ dur: 0.03, vol: 0.07, type: 'highpass', freq: 3200 }); },
    press() { tone(520, { type: 'triangle', dur: 0.06, vol: 0.1 }); tone(260, { dur: 0.08, vol: 0.07 }); },
    hum(d = 1) {

    },
    steam() { noise({ dur: 0.45, vol: 0.06, type: 'highpass', freq: 2600, attack: 0.05 }); },
    roll() { noise({ dur: 0.28, vol: 0.07, type: 'bandpass', freq: 380, q: 3, slide: 900 }); tone(180, { dur: 0.12, vol: 0.12, at: 0.26, slide: 90 }); },
    ding(i = 0) { const f = 784 * Math.pow(2, (i * 2) / 12); tone(f, { dur: 1.1, vol: 0.15 }); tone(f * 2.76, { dur: 0.6, vol: 0.045 }); tone(f * 5.4, { dur: 0.3, vol: 0.02 }); },
    thud() { tone(130, { dur: 0.35, vol: 0.3, slide: 45 }); noise({ dur: 0.18, vol: 0.18, type: 'lowpass', freq: 300 }); },
    win() { [0, 4, 7, 12, 16].forEach((s, k) => tone(523.25 * Math.pow(2, s / 12), { dur: 0.9, vol: 0.1, at: k * 0.11 })); },
    shutter() { noise({ dur: 0.6, vol: 0.06, type: 'bandpass', freq: 700, q: 2, slide: 240 }); for (let k = 0; k < 6; k++) tone(300, { type: 'square', dur: 0.015, vol: 0.025, at: k * 0.09 }); },
    doors() { noise({ dur: 1, vol: 0.05, type: 'bandpass', freq: 300, q: 1.5, slide: 120 }); tone(90, { type: 'sawtooth', dur: 0.9, vol: 0.035 }); },

/* =====================================================================
   МОДУЛЬ 9. ЧАСТИЦЫ (Canvas)
   ===================================================================== */
const FX = (() => {
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  let parts = [], raf = 0, dpr = 1, last = 0;
  function resize() { dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.floor(innerWidth * dpr); cv.height = Math.floor(innerHeight * dpr); }
  window.addEventListener('resize', resize); resize();
  function loop(t) {
    const dt = Math.min(50, t - (last || t)) / 16.67; last = t;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => (p.life -= dt) > 0);
    for (const p of parts) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.vx *= p.drag || 1; p.rot += (p.vr || 0) * dt;
      const k = p.life / p.max;
      ctx.save(); ctx.globalAlpha = Math.max(0, p.kind === 'steam' ? k * 0.5 : k);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      if (p.kind === 'steam') { const r = p.r * (1 + (1 - k) * 2.2); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, 'rgba(245,240,230,.9)'); g.addColorStop(1, 'rgba(245,240,230,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); }
      else if (p.kind === 'spark') { ctx.strokeStyle = p.c; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-p.vx * 2, -p.vy * 2); ctx.stroke(); }
      else { ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r); }
      ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(loop); else { raf = 0; last = 0; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  function add(p) { p.max = p.life; p.rot = p.rot || 0; parts.push(p); if (!raf) raf = requestAnimationFrame(loop); }
  const off = () => UI.reduced();
  return {
    steam(x, y, n = 5) { if (off()) return; for (let i = 0; i < n; i++) add({ kind: 'steam', x: x + (Math.random() - 0.5) * 6, y, vx: (Math.random() - 0.3) * 0.6, vy: -0.8 - Math.random() * 0.8, r: 5 + Math.random() * 4, life: 50 + Math.random() * 30, drag: 0.99 }); },
    sparks(x, y, n = 24, colors = ['#ffe08a', '#ffb84a', '#fff']) { if (off()) return; for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4; add({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, g: 0.15, c: colors[i % colors.length], life: 30 + Math.random() * 25 }); } },
    confetti(x, y, n = 40) { if (off()) return; const cs = ['#d9a94f', '#5cff8f', '#fff0b8', '#d8402e', '#2f67c9']; for (let i = 0; i < n; i++) add({ kind: 'conf', x, y, vx: (Math.random() - 0.5) * 9, vy: -4 - Math.random() * 6, g: 0.2, drag: 0.98, vr: (Math.random() - 0.5) * 0.4, r: 3 + Math.random() * 3, c: cs[i % cs.length], life: 70 + Math.random() * 40 }); },
  };
})();

/* =====================================================================
   МОДУЛЬ 10. РЕДАКТОРЫ ВХОДА И ОТВЕТА
   ===================================================================== */
const Editors = (() => {
  const LAT = { a: 0, f: 0, o: 1, j: 1, u: 2, e: 2, y: 2, b: 3, ',': 3, v: 4, d: 4, r: 5, p: 5, h: 5 };
  function letterIndex(e) {
    const k = e.key.toUpperCase();
    const i = D.LETTERS.indexOf(k);
    if (i >= 0) return i;
    if (e.key.length === 1 && LAT[e.key.toLowerCase()] !== undefined && /[a-z]/i.test(e.key)) return LAT[e.key.toLowerCase()];
    return -1;
  }
  function restoreFocus(root, key) { if (!key) return; const el = root.querySelector(`[data-f="${key}"]`); if (el) el.focus(); }
  const curFocus = root => { const a = document.activeElement; return a && root.contains(a) ? a.getAttribute('data-f') : null; };

  /* числа */
  function num(o) {
    const root = document.createElement('div'); root.className = 'editor';
    const vals = (o.value || Array(o.count).fill(o.min > 0 ? o.min : 0)).slice();
    const inputs = [];
    for (let i = 0; i < o.count; i++) {
      const d = document.createElement('div'); d.className = 'dial';
      const name = o.count > 1 ? ['a', 'b', 'c'][i] : 'n';
      d.innerHTML = `<button type="button" class="btn btn-iron" data-d="-1" aria-label="Уменьшить ${name}">▼</button><input type="number" inputmode="numeric" min="${o.min}" max="${o.max}" aria-label="${o.label || 'Число'} ${name}, от ${o.min} до ${o.max}" value="${o.empty ? '' : vals[i]}"><button type="button" class="btn btn-iron" data-d="1" aria-label="Увеличить ${name}">▲</button>`;
      const inp = d.querySelector('input');
      inputs.push(inp);
      d.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        let v = parseInt(inp.value, 10); if (isNaN(v)) v = o.min > 0 ? o.min : 0;
        v += +b.dataset.d; if (v > o.max) v = o.wrap ? o.min : o.max; if (v < o.min) v = o.wrap ? o.max : o.min;
        inp.value = v; Snd.click(); o.onChange && o.onChange();
      });
      inp.addEventListener('input', () => o.onChange && o.onChange());
      inp.addEventListener('change', () => { const v = parseInt(inp.value, 10); if (!isNaN(v)) inp.value = Math.max(o.min, Math.min(o.max, v)); o.onChange && o.onChange(); });
      root.appendChild(d);
    }
    return {
      el: root,
      get() { const r = inputs.map(i => parseInt(i.value, 10)); if (r.some(v => isNaN(v) || v < o.min || v > o.max)) return null; return o.single ? r[0] : r; },
      set(v) { const arr = o.single ? [v] : v; inputs.forEach((inp, i) => { inp.value = arr[i]; }); o.onChange && o.onChange(); },
      focus() { inputs[0].focus(); },
    };
  }

  /* последовательность шаров */
  function cols(o) {
    const root = document.createElement('div'); root.className = 'ed-col';
    let arr = (o.value || [0, 1, 2]).slice(), sel = 0;
    const nCol = o.brown ? 7 : 6;
    function render() {
      const fk = curFocus(root);
      let h = `<div class="slots" role="group" aria-label="${o.label || 'Шары'}: выберите место, затем цвет">`;
      arr.forEach((c, i) => { h += `<button type="button" class="slot ${i === sel ? 'sel' : ''}" data-f="s${i}" data-slot="${i}" aria-pressed="${i === sel}" aria-label="Место ${i + 1}: ${D.CNAME[c]}">${Gfx.item('col', c, 44, D.CNAME[c])}</button>`; });
      h += `</div><div class="palette" role="group" aria-label="Палитра">`;
      for (let c = 0; c < nCol; c++) h += `<button type="button" class="swatch" data-f="c${c}" data-col="${c}" aria-pressed="${arr[sel] === c}" aria-label="${D.CNAME[c]} (клавиша ${c + 1})">${Gfx.item('col', c, 40, D.CNAME[c])}</button>`;
      h += `</div>`;
      if (o.minLen !== o.maxLen) h += `<div class="len-ctl"><button type="button" class="btn btn-sm btn-iron" data-f="lm" data-len="-1" aria-label="Убрать шар" ${arr.length <= o.minLen ? 'disabled' : ''}>−</button><span>Шаров: <b class="mono">${arr.length}</b></span><button type="button" class="btn btn-sm btn-iron" data-f="lp" data-len="1" aria-label="Добавить шар" ${arr.length >= o.maxLen ? 'disabled' : ''}>+</button></div>`;
      root.innerHTML = h; restoreFocus(root, fk);
    }
    function setColor(c) { arr[sel] = c; if (sel < arr.length - 1) sel++; Snd.click(); render(); o.onChange && o.onChange(); }
    root.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.slot) { sel = +b.dataset.slot; Snd.click(); render(); }
      else if (b.dataset.col) setColor(+b.dataset.col);
      else if (b.dataset.len) { const d = +b.dataset.len; if (d > 0 && arr.length < o.maxLen) arr.push(arr[arr.length - 1]); if (d < 0 && arr.length > o.minLen) arr.pop(); sel = Math.min(sel, arr.length - 1); Snd.click(); render(); o.onChange && o.onChange(); }
    });
    root.addEventListener('keydown', e => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= nCol) { e.preventDefault(); setColor(n - 1); restoreFocus(root, 's' + sel); }
      else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.dataset.slot) { e.preventDefault(); sel = Math.max(0, Math.min(arr.length - 1, sel + (e.key === 'ArrowRight' ? 1 : -1))); render(); restoreFocus(root, 's' + sel); }
    });
    render();
    return { el: root, get: () => arr.slice(), set(v) { arr = v.slice(); sel = 0; render(); o.onChange && o.onChange(); }, focus() { restoreFocus(root, 's0'); } };
  }

  /* один цвет (ответ) */
  function col1(o) {
    const root = document.createElement('div'); root.className = 'palette'; root.setAttribute('role', 'radiogroup'); root.setAttribute('aria-label', o.label || 'Цвет');
    let val = o.value != null ? o.value : null;
    function render() {
      const fk = curFocus(root);
      let h = '';
      for (let c = 0; c < 7; c++) h += `<button type="button" class="swatch" role="radio" data-f="c${c}" data-col="${c}" aria-checked="${val === c}" aria-pressed="${val === c}" aria-label="${D.CNAME[c]}">${Gfx.item('col', c, 40, D.CNAME[c])}</button>`;
      root.innerHTML = h; restoreFocus(root, fk);
    }
    root.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; val = +b.dataset.col; Snd.click(); render(); o.onChange && o.onChange(); });
    render();
    return { el: root, get: () => val, set(v) { val = v; render(); }, focus() { restoreFocus(root, 'c0'); } };
  }

  /* фигуры */
  const shapeIcon = f => `<svg viewBox="0 0 26 26" aria-hidden="true">${['<circle cx="13" cy="13" r="9"', '<rect x="5" y="5" width="16" height="16" rx="2"', '<polygon points="13,3 23,21 3,21"'][f]} fill="currentColor"/></svg>`;
  function shps(o) {
    const root = document.createElement('div'); root.className = 'ed-col';
    let arr = (o.value || [D.shp(0, 0, 1), D.shp(1, 1, 0), D.shp(2, 2, 1)]).slice(), sel = 0;
    function render() {
      const fk = curFocus(root);
      let h = `<div class="slots" role="group" aria-label="${o.label || 'Фигуры'}: выберите место">`;
      arr.forEach((x, i) => { h += `<button type="button" class="slot ${i === sel ? 'sel' : ''}" data-f="s${i}" data-slot="${i}" aria-pressed="${i === sel}" aria-label="Место ${i + 1}: ${D.shapeText(x)}">${Gfx.item('shps', [x], 46, D.shapeText(x))}</button>`; });
      h += `</div>`;
      const cur = arr[sel], f = D.sf(cur), c = D.sc(cur), s = D.ss(cur);
      h += `<div class="seg" role="group" aria-label="Форма"><span class="seg-lab">Форма</span>${[0, 1, 2].map(k => `<button type="button" data-f="f${k}" data-set="f" data-v="${k}" aria-pressed="${f === k}" aria-label="${D.SHAPE_F[k]}">${shapeIcon(k)}</button>`).join('')}</div>`;
      h += `<div class="seg" role="group" aria-label="Цвет"><span class="seg-lab">Цвет</span>${[0, 1, 2].map(k => `<button type="button" data-f="c${k}" data-set="c" data-v="${k}" aria-pressed="${c === k}" aria-label="${D.SHAPE_CN[k]}">${Gfx.item('col', D.SHAPE_C[k], 28, D.SHAPE_CN[k])}</button>`).join('')}</div>`;
      h += `<div class="seg" role="group" aria-label="Размер"><span class="seg-lab">Размер</span>${[0, 1].map(k => `<button type="button" data-f="z${k}" data-set="s" data-v="${k}" aria-pressed="${s === k}">${D.SIZE_N[k]}</button>`).join('')}</div>`;
      if (o.minLen !== o.maxLen) h += `<div class="len-ctl"><button type="button" class="btn btn-sm btn-iron" data-f="lm" data-len="-1" aria-label="Убрать фигуру" ${arr.length <= o.minLen ? 'disabled' : ''}>−</button><span>Фигур: <b class="mono">${arr.length}</b></span><button type="button" class="btn btn-sm btn-iron" data-f="lp" data-len="1" aria-label="Добавить фигуру" ${arr.length >= o.maxLen ? 'disabled' : ''}>+</button></div>`;
      root.innerHTML = h; restoreFocus(root, fk);
    }
    root.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.slot) { sel = +b.dataset.slot; }
      else if (b.dataset.set) { const cur = arr[sel], v = +b.dataset.v; const f = b.dataset.set === 'f' ? v : D.sf(cur), c = b.dataset.set === 'c' ? v : D.sc(cur), s = b.dataset.set === 's' ? v : D.ss(cur); arr[sel] = D.shp(f, c, s); o.onChange && o.onChange(); }
      else if (b.dataset.len) { const d = +b.dataset.len; if (d > 0 && arr.length < o.maxLen) arr.push(arr[arr.length - 1]); if (d < 0 && arr.length > o.minLen) arr.pop(); sel = Math.min(sel, arr.length - 1); o.onChange && o.onChange(); }
      Snd.click(); render();
    });
    root.addEventListener('keydown', e => {
      if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.dataset.slot) { e.preventDefault(); sel = Math.max(0, Math.min(arr.length - 1, sel + (e.key === 'ArrowRight' ? 1 : -1))); render(); restoreFocus(root, 's' + sel); }
    });
    render();
    return { el: root, get: () => arr.slice(), set(v) { arr = v.slice(); sel = 0; render(); o.onChange && o.onChange(); }, focus() { restoreFocus(root, 's0'); } };
  }

  /* сетка */
  function grid(o) {
    const n = o.n, root = document.createElement('div');
    root.className = 'grid-ed n' + n; root.style.gridTemplateColumns = `repeat(${n}, auto)`;
    root.setAttribute('role', 'grid'); root.setAttribute('aria-label', (o.label || 'Сетка') + ` ${n}×${n}: стрелки — перемещение, пробел — переключить`);
    let arr = (o.value || Array(n * n).fill(0)).slice(), focusI = 0;
    function render() {
      const fk = curFocus(root);
      root.innerHTML = arr.map((v, i) => `<button type="button" class="cell" data-f="g${i}" data-i="${i}" tabindex="${i === focusI ? 0 : -1}" aria-pressed="${!!v}" aria-label="Строка ${Math.floor(i / n) + 1}, столбец ${(i % n) + 1}: ${v ? 'включена' : 'выключена'}"></button>`).join('');
      restoreFocus(root, fk);
    }
    root.addEventListener('click', e => { const b = e.target.closest('.cell'); if (!b) return; const i = +b.dataset.i; arr[i] = 1 - arr[i]; focusI = i; Snd.click(); render(); restoreFocus(root, 'g' + i); o.onChange && o.onChange(); });
    root.addEventListener('keydown', e => {
      const d = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: n, ArrowUp: -n }[e.key];
      if (d === undefined) return;
      e.preventDefault();
      let ni = focusI + d;
      if (Math.abs(d) === 1 && Math.floor(ni / n) !== Math.floor(focusI / n)) return;
      if (ni < 0 || ni >= n * n) return;
      focusI = ni; render(); restoreFocus(root, 'g' + ni);
    });
    render();
    return { el: root, get: () => arr.slice(), set(v) { arr = v.slice(); render(); o.onChange && o.onChange(); }, focus() { restoreFocus(root, 'g' + focusI); } };
  }

  /* слово */
  function word(o) {
    const root = document.createElement('div'); root.className = 'ed-col'; root.tabIndex = -1;
    let arr = (o.value || [3, 0, 5]).slice();
    function render() {
      const fk = curFocus(root);
      let h = `<div class="slots" aria-live="polite" aria-label="Слово: ${arr.map(i => D.LETTERS[i]).join('') || 'пусто'}">`;
      for (let i = 0; i < o.maxLen; i++) h += `<span class="slot slot-word" style="cursor:default;${i >= arr.length ? 'opacity:.35' : ''}" aria-hidden="true">${i < arr.length ? D.LETTERS[arr[i]] : '·'}</span>`;
      h += `</div><div class="keys" role="group" aria-label="Буквы: можно печатать с клавиатуры">`;
      D.LETTERS.forEach((L, i) => { h += `<button type="button" class="btn" data-f="k${i}" data-k="${i}" aria-label="Буква ${L}${D.isVowel(i) ? ', гласная' : ''}" ${arr.length >= o.maxLen ? 'disabled' : ''}>${L}</button>`; });
      h += `<button type="button" class="btn btn-iron" data-f="bs" data-k="bs" aria-label="Стереть последнюю букву" ${arr.length === 0 ? 'disabled' : ''}>⌫</button></div><div class="len-ctl">Букв: <b class="mono">${arr.length}</b> (от ${o.minLen} до ${o.maxLen})</div>`;
      root.innerHTML = h; restoreFocus(root, fk);
    }
    function addL(i) { if (arr.length < o.maxLen) { arr.push(i); Snd.click(); render(); o.onChange && o.onChange(); } }
    function bs() { if (arr.length) { arr.pop(); Snd.click(); render(); o.onChange && o.onChange(); } }
    root.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.k === 'bs') bs(); else addL(+b.dataset.k); });
    function onKey(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return false;
      if (e.key === 'Backspace') { e.preventDefault(); bs(); return true; }
      const i = letterIndex(e); if (i >= 0) { e.preventDefault(); addL(i); return true; }
      return false;
    }
    root.addEventListener('keydown', e => { if (onKey(e)) e.stopPropagation(); });
    render();
    return { el: root, onKey, get: () => (arr.length >= o.minLen && arr.length <= o.maxLen ? arr.slice() : null), set(v) { arr = v.slice(); render(); o.onChange && o.onChange(); }, focus() { restoreFocus(root, 'k0'); } };
  }

  /* да / нет */
  function bool(o) {
    const root = document.createElement('div'); root.className = 'boolpick'; root.setAttribute('role', 'radiogroup'); root.setAttribute('aria-label', o.label || 'Лампа');
    let val = null;
    function render() {
      const fk = curFocus(root);
      root.innerHTML = [true, false].map(v => `<button type="button" role="radio" data-f="b${v}" data-v="${v}" aria-checked="${val === v}" aria-pressed="${val === v}">${Gfx.item('bool', v, 30, v ? 'да' : 'нет').replace(/<text[\s\S]*?<\/text>/, '')}${v ? 'Да' : 'Нет'}</button>`).join('');
      restoreFocus(root, fk);
    }
    root.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; val = b.dataset.v === 'true'; Snd.click(); render(); o.onChange && o.onChange(); });
    render();
    return { el: root, get: () => val, set(v) { val = v; render(); }, focus() { restoreFocus(root, 'btrue'); } };
  }

  function forInput(spec, value, onChange) {
    switch (spec.type) {
      case 'nums': return num({ count: spec.count, min: spec.min, max: spec.max, value, onChange, label: 'Вход', wrap: true });
      case 'cols': return cols({ minLen: spec.minLen, maxLen: spec.maxLen, value, onChange, label: 'Входные шары' });
      case 'shps': return shps({ minLen: spec.minLen, maxLen: spec.maxLen, value, onChange, label: 'Входные фигуры' });
      case 'grid': return grid({ n: spec.n, value, onChange, label: 'Входная сетка' });
      case 'word': return word({ minLen: spec.minLen, maxLen: spec.maxLen, value, onChange });
    }
  }
  function forOutput(outType, L, lastIn, label) {
    const same = { cols: 'cols', shps: 'shps', grid: 'grid', word: 'word' }[outType] === L.inSpec.type;
    const pre = same ? lastIn.slice() : null;
    switch (outType) {
      case 'num': return num({ count: 1, min: -9999, max: 99999, empty: true, single: true, label: label || 'Ответ' });
      case 'col': return col1({ label });
      case 'cols': return cols({ minLen: 1, maxLen: 7, value: pre || [0], brown: true, label: label || 'Ответ' });
      case 'shps': return shps({ minLen: 1, maxLen: 6, value: pre || undefined, label: label || 'Ответ' });
      case 'grid': return grid({ n: L.inSpec.n, value: pre || undefined, label: label || 'Ответ' });
      case 'bool': return bool({ label });
      case 'word': return word({ minLen: 1, maxLen: 7, value: pre || [] });
    }
  }
  return { forInput, forOutput };
})();

/* =====================================================================
   МОДУЛЬ 11. СОСТОЯНИЕ ИГРЫ
   ===================================================================== */
const Game = (() => {
  let L = null, S = null, key = null;
  const blank = () => ({ journal: [], exp: 0, fails: 0, hints: [], notes: '', attempt: 0, usedExam: [], mem: [], exam: null, won: false, stars: 0, nextId: 1, tut: 0, counted: false, draft: null });
  function open(level, saveKey) {
    L = level; key = saveKey;
    const all = Store.data.saves;
    if (!all[key]) all[key] = blank();
    S = Object.assign(blank(), all[key]); all[key] = S;
    Store.save();
  }
  const persist = () => Store.save();
  const target = () => Exam.target(L).value;
  const starsFor = exp => { const t = target(); return exp <= t ? 3 : exp <= t + 3 ? 2 : 1; };
  function run(x) {
    const hist = L.stateful ? S.mem.concat([x]) : [x];
    const out = L.rule.run(hist);
    if (L.stateful) S.mem = hist;
    S.exp++;
    const e = { id: S.nextId++, n: S.exp, hist, out, tag: 'exp', pinned: false, mark: 0 };
    S.journal.push(e); persist();
    return e;
  }
  function resetMachine() { S.mem = []; persist(); }
  function startExam() {
    const ex = Exam.build(L, S.journal, S.attempt, S.usedExam);
    S.exam = ex.qs.map(q => ({ hist: q.hist, out: q.out }));
    persist();
    return S.exam;
  }
  function submit(answers) {
    const qs = S.exam, results = qs.map((q, i) => answers[i] !== null && answers[i] !== undefined && D.eq(answers[i], q.out));
    const ok = results.every(Boolean);
    if (ok) { S.won = true; S.stars = starsFor(S.exp); record(); }
    else {
      qs.forEach((q, i) => { if (!results[i]) S.journal.push({ id: S.nextId++, n: S.exp, hist: q.hist, out: q.out, tag: 'exam', pinned: false, mark: 0 }); });
      S.exp += 3; S.fails++; S.attempt++;
      S.usedExam.push(...qs.map(q => D.key(q.hist)));
    }
    S.exam = null; persist();
    return { ok, results, qs };
  }
  function record() {
    if (S.counted) return;
    S.counted = true;
    const d = Store.data;
    if (L.mode === 'campaign') { const p = d.prog[L.idx] || { stars: 0, exp: Infinity }; d.prog[L.idx] = { stars: Math.max(p.stars, S.stars), exp: Math.min(p.exp === null ? Infinity : p.exp, S.exp) }; }
    else if (L.mode === 'daily') { const p = d.daily[L.dateKey]; if (!p || p.stars < S.stars) d.daily[L.dateKey] = { stars: S.stars, exp: S.exp }; }
    else if (L.mode === 'endless') { d.endless.solved++; d.endless.stars += S.stars; if (d.endless.n === L.n) d.endless.n++; }
  }
  function takeHint() {
    if (S.hints.length >= 3 || S.won) return null;
    const h = { n: S.hints.length + 1 };
    if (h.n === 2) h.hist = Exam.suggest(L, S.journal);
    S.hints.push(h); S.exp += 2; persist();
    return h;
  }
  function replay() { Store.data.saves[key] = S = blank(); persist(); }
  return {
    open, run, resetMachine, startExam, submit, takeHint, replay, target, starsFor, persist,
    get L() { return L; }, get S() { return S; }, get key() { return key; },
  };
})();

  function renderGauges() {
    const S = Game.S, t = Game.target();
    $('#expGauge').innerHTML = Gfx.gauge(S.exp, t);
    $('#expVal').textContent = `${S.exp}/${t}`;
    $('#failVal').textContent = S.fails;
    $('#hintVal').textContent = `${S.hints.length}/3`;
    const disp = $('#mDisp');
    if (disp) disp.textContent = Game.L.stateful ? `П·${String(S.mem.length).padStart(2, '0')}` : String(S.exp).padStart(3, '0');
    const nd = $('#mNeedle');
    if (nd) nd.style.transform = `rotate(${-90 + Math.min(1, S.exp / (t + 6)) * 180}deg)`;
  }
  function renderReadout(e) {
    const L = Game.L, r = $('#readout');
    if (!e) { r.innerHTML = `<span class="ro-empty">Табло пусто — подайте первый вход</span>`; return; }
    const memNote = L.stateful ? `<span class="ro-lab">запуск ${e.hist.length} после сброса</span>` : '';
    r.innerHTML = `<div class="ro-item"><span class="ro-lab">вход</span>${Gfx.item(inKind(), e.hist[e.hist.length - 1], 36)}</div><span class="ro-arrow" aria-hidden="true">⟶</span><div class="ro-item"><span class="ro-lab">выход</span>${Gfx.item(L.rule.outType, e.out, 36)}</div>${memNote}<span class="sr-only">Выход: ${D.valText(L.rule.outType, e.out)}</span>`;
    r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash');
  }
  function setTray(id, kind, v) {
    const g = document.getElementById(id); if (!g) return;
    const box = id === 'mIn' ? [12, 118, 112, 54] : [316, 118, 112, 54];
    g.innerHTML = v == null ? '' : Gfx.itemFit(kind, v, ...box);
  }

  /* ---------- пульт: опыты / экзамен / победа ---------- */
  function renderConsole() {
    const S = Game.S, L = Game.L, c = $('#console');
    examEds = [];
    if (S.won) {
      c.innerHTML = `<div class="won-banner"><div><h2 class="plate-title" style="margin:0">Машина раскрыта</h2><div class="big-stars" aria-label="Звёзд: ${S.stars}">${'★'.repeat(S.stars)}${'☆'.repeat(3 - S.stars)}</div></div><div class="grp" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="btnShowWin">Показать механизм</button><button type="button" class="btn btn-iron" id="btnReplay">Переиграть</button>${nextAvailable() ? '<button type="button" class="btn btn-go" id="btnNext">Дальше</button>' : ''}</div></div>`;
      $('#btnShowWin').onclick = () => { Snd.press(); showWinModal(); };
      $('#btnReplay').onclick = () => { Snd.press(); replay(); };
      if ($('#btnNext')) $('#btnNext').onclick = () => { Snd.press(); goNext(); };
      setTray('mIn', null, null);
      return;
    }
    if (S.exam) { renderExam(); return; }
    const memInfo = L.stateful ? `<p class="kbd-note" style="margin:10px 0 0">Машина помнит прошлые входы. С момента сброса подано: <b class="mono">${S.mem.length}</b></p>` : '';
    c.innerHTML = `<h2 class="plate-title"><span>Приёмный лоток</span><small>соберите вход и запустите машину</small></h2><div id="edHost"></div>${memInfo}
      <div class="controls"><div class="grp"><button type="button" class="btn btn-sm btn-iron" id="btnRand">Случайный вход</button>${L.stateful ? '<button type="button" class="btn btn-sm" id="btnReset">Сбросить машину</button>' : ''}</div>
      <div class="grp"><button type="button" class="btn btn-run" id="btnRun" title="Ctrl+Enter">Запустить</button><button type="button" class="btn btn-go" id="btnExam">Я понял</button></div></div>
      <p class="kbd-note" style="margin:8px 0 0">Ctrl+Enter — запустить. Цель: <b>${Game.target()}</b> ${D.plural(Game.target(), 'опыт', 'опыта', 'опытов')} на три звезды.</p>`;
    const r0 = RNG.make(RNG.hash('draft', L.seed));
    const initial = S.draft || Levels.sampleIn(L.inSpec, r0);
    editor = Editors.forInput(L.inSpec, initial, () => { const v = editor.get(); if (v) { S.draft = v; setTray('mIn', inKind(), v); } tutorEvent('input'); });
    $('#edHost').appendChild(editor.el);
    setTray('mIn', inKind(), editor.get());
    $('#btnRun').onclick = runExperiment;
    $('#btnExam').onclick = askExam;
    $('#btnRand').onclick = () => { Snd.click(); editor.set(Levels.sampleIn(L.inSpec, RNG.make((Math.random() * 1e9) >>> 0))); };
    if ($('#btnReset')) $('#btnReset').onclick = resetMachine;
  }

  async function animateRun(x, out) {
    const L = Game.L, svg = $('#machineSvg'), inG = $('#mIn'), outG = $('#mOut');
    setTray('mIn', inKind(), x);
    setTray('mOut', null, null);
    Snd.press();
    if (reduced()) {
      svg.classList.add('running'); await sleep(260); svg.classList.remove('running');
      setTray('mOut', L.rule.outType, out);
      outG.animate && outG.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 });
      return;
    }
    if (inG.animate) inG.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: 'translate(70px,10px) scale(.35)', opacity: 0 }], { duration: 380, easing: 'cubic-bezier(.5,0,.9,.5)', fill: 'forwards' });
    await sleep(180);
    svg.classList.add('running'); Snd.hum(1.0);
    const ch = $('#mChimney'), puff = () => { if (!ch) return; const b = ch.getBoundingClientRect(); FX.steam(b.left + b.width / 2, b.top, 5); };
    puff(); Snd.steam();
    await sleep(300); puff();
    await sleep(300); puff(); Snd.steam();
    await sleep(270);
    svg.classList.remove('running');
    setTray('mOut', L.rule.outType, out);
    if (outG.animate) outG.animate([{ transform: 'translate(-70px,6px) scale(.4)', opacity: 0 }, { transform: 'translate(6px,0) scale(1.05)', opacity: 1, offset: 0.75 }, { transform: 'translate(0,0) scale(1)', opacity: 1 }], { duration: 380, easing: 'ease-out' });
    Snd.roll();
    if (inG.getAnimations) inG.getAnimations().forEach(a => a.cancel());
    if (inG.animate) inG.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 200, fill: 'backwards' });
    await sleep(300);
  }
  async function runExperiment() {
    if (busy || !editor) return;
    const x = editor.get();
    if (!x) { toast('Соберите корректный вход'); Snd.thud(); return; }
    busy = true; $('#btnRun').disabled = true; $('#btnExam').disabled = true;
    const e = Game.run(x);
    await animateRun(x, e.out);
    renderReadout(e); renderJournal(); renderGauges();
    if (Game.L.stateful) { const p = $('#console .kbd-note b'); if (p) p.textContent = Game.S.mem.length; }
    busy = false;
    if ($('#btnRun')) { $('#btnRun').disabled = false; $('#btnExam').disabled = false; }
    tutorEvent('run');
  }
  async function resetMachine() {
    if (busy) return;
    Game.resetMachine(); Snd.shutter();
    const svg = $('#machineSvg');
    svg.querySelectorAll('.m-lamp').forEach(l => l.classList.add('on'));
    await sleep(reduced() ? 120 : 400);
    svg.querySelectorAll('.m-lamp').forEach(l => l.classList.remove('on'));
    renderConsole(); renderGauges();
    toast('Память машины очищена');
  }

  /* ---------- экзамен ---------- */
  function askExam() {
    if (busy) return;
    const L = Game.L, n = L.rule.outType === 'bool' ? 5 : 3;
    modal({
      title: 'Сдать экзамен?',
      html: `<p>Машина закроется шторками и покажет <b>${n}</b> ${D.plural(n, 'новый вход', 'новых входа', 'новых входов')}. Для каждого нужно предсказать выход.</p><p>Вернуться к опытам без ответа нельзя. Ошибка — штраф <b>+3</b> опыта, правильный ответ попадёт в журнал.</p>${L.stateful ? '<p>У машины с памятью каждый вопрос — серия входов после сброса: предскажите выход на последнем.</p>' : ''}`,
      actions: [{ label: 'Начать экзамен', cls: 'btn-go', onClick: startExam }, { label: 'Ещё подумаю', cls: 'btn-iron' }],
    });
  }
  function startExam() {
    Game.startExam();
    document.body.classList.add('is-exam'); Snd.shutter();
    const svg = $('#machineSvg'); svg.querySelectorAll('.m-lamp').forEach(l => l.classList.remove('ok', 'bad', 'on'));
    renderConsole();
    tutorEvent('exam');
  }
  function renderExam() {
    const S = Game.S, L = Game.L, c = $('#console');
    c.innerHTML = `<h2 class="plate-title"><span>Экзамен</span><small>попытка ${S.attempt + 1} · предскажите выход машины</small></h2><div class="exam-list" id="examList"></div><div class="exam-warn" id="examWarn" role="alert"></div><div class="controls"><span class="kbd-note">Ответ на каждый вопрос обязателен</span><button type="button" class="btn btn-go" id="btnSubmit">Сдать</button></div>`;
    const list = $('#examList');
    examEds = S.exam.map((q, i) => {
      const box = document.createElement('div'); box.className = 'exam-q'; box.id = 'q' + i;
      const last = q.hist[q.hist.length - 1];
      let inH;
      if (L.stateful) {
        inH = `<span>После сброса:</span><span class="q-hist">${q.hist.map((x, k) => `<span class="${k < q.hist.length - 1 ? 'faded' : ''}">${Gfx.item(inKind(), x, 28)}</span>${k < q.hist.length - 1 ? '<span aria-hidden="true">→</span>' : ''}`).join('')}</span><span>— выход на последнем?</span>`;
      } else inH = `<span>Вход:</span>${Gfx.item(inKind(), last, 34)}<span aria-hidden="true">⟶ ?</span>`;
      box.innerHTML = `<div class="q-lamp" aria-hidden="true">${i + 1}</div><div><div class="q-in">${inH}</div><div class="q-ans"></div></div>`;
      box.setAttribute('role', 'group'); box.setAttribute('aria-label', `Вопрос ${i + 1}`);
      const ed = Editors.forOutput(L.rule.outType, L, last, `Ответ на вопрос ${i + 1}`);
      box.querySelector('.q-ans').appendChild(ed.el);
      list.appendChild(box);
      return ed;
    });
    $('#btnSubmit').onclick = submitExam;
  }
  async function submitExam() {
    if (busy) return;
    const answers = examEds.map(e => e.get());
    const miss = answers.findIndex(a => a === null || a === undefined);
    if (miss >= 0) { $('#examWarn').textContent = `Нет ответа на вопрос ${miss + 1}`; Snd.thud(); return; }
    busy = true; $('#btnSubmit').disabled = true;
    const qs = Game.S.exam.slice();
    const res = Game.submit(answers);
    const svg = $('#machineSvg');
    for (let i = 0; i < qs.length; i++) {
      await sleep(reduced() ? 120 : 380);
      const ok = res.results[i];
      const box = document.getElementById('q' + i); if (box) box.classList.add(ok ? 'ok' : 'bad');
      const lamp = svg.querySelector(`.m-lamp[data-i="${i}"]`); if (lamp) lamp.classList.add(ok ? 'ok' : 'bad');
      if (ok) Snd.ding(i); else Snd.thud();
    }
    await sleep(reduced() ? 150 : 400);
    busy = false;
    tutorEvent('submit');
    if (res.ok) win(); else fail(res, answers);
  }
  function fail(res, answers) {
    const L = Game.L;
    document.body.classList.remove('is-exam');
    const wrong = res.qs.map((q, i) => ({ q, a: answers[i], ok: res.results[i] })).filter(x => !x.ok);
    const html = `<p>Верно ${res.results.filter(Boolean).length} из ${res.qs.length}. Штраф: <b>+3</b> опыта. Правильные ответы добавлены в журнал.</p><div class="wrong-list">${wrong.map(w => `<div class="wrong"><div class="w-row">Вход: ${L.stateful ? w.q.hist.map(x => Gfx.item(inKind(), x, 24)).join(' → ') : Gfx.item(inKind(), w.q.hist[0], 28)}</div><div class="w-row">Ваш ответ ✗ ${Gfx.item(L.rule.outType, w.a, 28)}</div><div class="w-row"><b>Верно ✓</b> ${Gfx.item(L.rule.outType, w.q.out, 28)}</div></div>`).join('')}</div><p class="kbd-note">Следующий экзамен будет с другими входами.</p>`;
    modal({ title: 'Экзамен не сдан', html, actions: [{ label: 'Вернуться к опытам', cls: 'btn-run' }] });
    $('#machineSvg').querySelectorAll('.m-lamp').forEach(l => setTimeout(() => l.classList.remove('ok', 'bad'), 900));
    renderConsole(); renderJournal(); renderGauges();
  }
  async function win() {
    const svg = $('#machineSvg');
    document.body.classList.remove('is-exam');
    await sleep(reduced() ? 50 : 350);
    svg.classList.add('revealed'); Snd.doors(); Snd.win();
    const b = svg.getBoundingClientRect();
    FX.sparks(b.left + b.width / 2, b.top + b.height * 0.45, 40);
    FX.confetti(b.left + b.width / 2, b.top + b.height * 0.3, 50);
    renderConsole(); renderGauges(); renderHints();
    $('#tutor').hidden = true;
    await sleep(reduced() ? 100 : 1100);
    showWinModal();
  }
  function exampleTrace() {
    const L = Game.L, r = RNG.make(RNG.hash('reveal', L.seed));
    const cands = Exam.candidates(L, r, 40);
    let h = cands[0];
    if (L.def.special && !L.stateful) { const s = L.def.special(r, L); if (s) h = s; }
    if (L.stateful) h = cands.find(x => x.length >= 3) || h;
    const stepHtml = (kind, v, cap, d) => `<div class="t-step" style="animation-delay:${d}s">${Gfx.item(kind, v, 34)}<span class="t-cap">${cap}</span></div>`;
    const opHtml = (txt, d) => `<div class="t-op" style="animation-delay:${d}s">${txt}</div>`;
    let out = '';
    if (L.stateful) {
      h.forEach((x, k) => {
        const o = L.rule.run(h.slice(0, k + 1));
        out += `<div class="t-step" style="animation-delay:${k * 0.5}s">${Gfx.item(inKind(), x, 28)}<span aria-hidden="true">↓</span>${Gfx.item(L.rule.outType, o, 28)}<span class="t-cap">запуск ${k + 1}</span></div>`;
      });
    } else if (L.rule.parts) {
      const [a, b] = L.rule.parts, x = h[0], mid = a.f(x);
      out = stepHtml(inKind(), x, 'вход', 0) + opHtml(a.desc, 0.4) + stepHtml(L.rule.midType, mid, 'промежуточно', 0.8) + opHtml(b.desc, 1.2) + stepHtml(L.rule.outType, b.f(mid), 'выход', 1.6);
    } else {
      out = stepHtml(inKind(), h[0], 'вход', 0) + opHtml('правило', 0.4) + stepHtml(L.rule.outType, L.rule.run(h), 'выход', 0.8);
    }
    return out;
  }
  function showWinModal() {
    const S = Game.S, L = Game.L, t = Game.target();
    const stars = [1, 2, 3].map(k => Gfx.star(k <= S.stars)).join('');
    const html = `<div class="win-stars" aria-label="Звёзд: ${S.stars} из 3">${stars}</div>
      <div class="stats"><div class="stat"><b>${S.exp}</b><span>опыты</span></div><div class="stat"><b>${t}</b><span>цель</span></div><div class="stat"><b>${S.fails}</b><span>провалы</span></div><div class="stat"><b>${S.hints.length}</b><span>подсказки</span></div></div>
      <div class="rule-card"><b>Правило машины</b>${L.rule.desc}</div>
      <div class="trace" aria-label="Пример работы механизма">${exampleTrace()}</div>
      <p class="kbd-note">${S.stars === 3 ? 'Безупречно: вы уложились в цель.' : S.stars === 2 ? `До трёх звёзд не хватило ${S.exp - t} ${D.plural(S.exp - t, 'опыта', 'опытов', 'опытов')}.` : 'Попробуйте переиграть и уложиться в цель.'}</p>`;
    const actions = [];
    if (nextAvailable()) actions.push({ label: L.mode === 'endless' ? 'Следующая машина' : 'Следующий уровень', cls: 'btn-go', onClick: goNext });
    actions.push({ label: 'Переиграть', cls: 'btn-iron', onClick: replay });
    actions.push({ label: 'К карте', onClick: showMap });
    modal({ title: 'Машина раскрыта!', html, actions });
  }
  function nextAvailable() {
    const L = Game.L;
    if (L.mode === 'campaign') return L.idx + 1 < Levels.DEFS.length;
    return L.mode === 'endless';
  }
  function goNext() {
    const L = Game.L;
    if (L.mode === 'campaign') openCampaign(L.idx + 1);
    else if (L.mode === 'endless') openEndless();
    else showMap();
  }
  function replay() { const L = Game.L, k = Game.key; Game.replay(); openLevel(L, k); }

  /* ---------- журнал ---------- */
  function renderJournal() {
    const S = Game.S, L = Game.L, ok = L.rule.outType;
    const counts = new Map();
    S.journal.forEach(e => { const k = D.key(e.out); counts.set(k, (counts.get(k) || { n: 0, v: e.out })); counts.get(k).n++; });
    if (jFilter && !counts.has(jFilter)) jFilter = '';
    const opts = [...counts.entries()].sort((a, b) => cmpOut(a[1].v, b[1].v));
    $('#jFilter').innerHTML = `<option value="">Все выходы (${S.journal.length})</option>` + opts.map(([k, o]) => `<option value='${k.replace(/'/g, '&#39;')}' ${k === jFilter ? 'selected' : ''}>Выход ${D.valShort(ok, o.v)} (${o.n})</option>`).join('');
    let rows = S.journal.filter(e => !jFilter || D.key(e.out) === jFilter);
    rows.sort((a, b) => (b.pinned - a.pinned) || (jSort === 'old' ? a.id - b.id : jSort === 'out' ? cmpOut(a.out, b.out) || a.id - b.id : b.id - a.id));
    $('#jCount').textContent = `${S.journal.length} ${D.plural(S.journal.length, 'запись', 'записи', 'записей')}`;
    const H = 24;
    const marks = ['○', '●', '▲', '■'], markN = ['нет', 'красная', 'зелёная', 'синяя'];
    $('#journal').innerHTML = rows.length ? rows.map(e => {
      const x = e.hist[e.hist.length - 1];
      const histTxt = L.stateful ? `после сброса: ${e.hist.map(v => D.valShort(inKind(), v)).join(' → ')}` : '';
      return `<li class="jrow mark-${e.mark} ${e.pinned ? 'pinned' : ''}" data-id="${e.id}" ${histTxt ? `title="${histTxt}"` : ''}>
        <span class="jn">${e.tag === 'exam' ? 'Э' : e.n}</span>
        <div class="jio" aria-label="${L.stateful ? histTxt + '. ' : ''}Вход ${D.valText(inKind(), x)}, выход ${D.valText(ok, e.out)}${e.tag === 'exam' ? ', из экзамена' : ''}">${L.stateful ? `<span class="jbadge" aria-hidden="true">↺${e.hist.length}</span>` : ''}${Gfx.item(inKind(), x, H)}<span class="jarrow" aria-hidden="true">→</span>${Gfx.item(ok, e.out, H)}${e.tag === 'exam' ? '<span class="jbadge exam" aria-hidden="true">экз</span>' : ''}</div>
        <div class="jbtns"><button type="button" data-act="pin" aria-pressed="${e.pinned}" aria-label="${e.pinned ? 'Открепить' : 'Закрепить'} запись">${Gfx.icons.pin}</button><button type="button" data-act="mark" class="mk${e.mark}" aria-label="Пометка: ${markN[e.mark]}. Сменить">${marks[e.mark]}</button></div></li>`;
    }).join('') : `<li class="journal-empty">${S.journal.length ? 'Нет записей с таким выходом' : 'Пока пусто. Каждый запуск машины записывается сюда.'}</li>`;
  }
  function cmpOut(a, b) {
    if (typeof a === 'number' && typeof b === 'number') return a - b;
    if (typeof a === 'boolean') return (b ? 1 : 0) - (a ? 1 : 0);
    return D.key(a) < D.key(b) ? -1 : D.key(a) > D.key(b) ? 1 : 0;
  }

  /* ---------- подсказки ---------- */
  function hintHtml(h) {
    const L = Game.L;
    if (h.n === 1) { const f = Levels.FAM[L.fam]; return `<b>Подсказка 1 · семейство</b>${f[0]}: ${f[1]}.`; }
    if (h.n === 2) {
      const hist = h.hist;
      if (L.stateful) return `<b>Подсказка 2 · полезный опыт</b>Сбросьте машину и подайте по очереди:<div class="hint-in">${hist.map(x => Gfx.item(inKind(), x, 28)).join('<span aria-hidden="true">→</span>')}</div>`;
      return `<b>Подсказка 2 · полезный опыт</b>Подайте такой вход:<div class="hint-in">${Gfx.item(inKind(), hist[0], 30)}<button type="button" class="btn btn-sm" data-put="1">Положить в лоток</button></div>`;
    }
    return `<b>Подсказка 3 · важный признак</b>${L.feat}`;
  }
  function renderHints() {
    const S = Game.S, list = $('#hintList');
    list.innerHTML = S.hints.map(h => `<li>${hintHtml(h)}</li>`).join('') || '<li style="background:none;box-shadow:none;padding:0;color:var(--ink-soft)">Подсказок пока нет. Каждая стоит +2 опыта.</li>';
    const b = $('#btnHint'), left = 3 - S.hints.length;
    b.textContent = left > 0 ? `Взять подсказку (${left} из 3) · +2 опыта` : 'Подсказки закончились';
    b.disabled = left <= 0 || S.won || !!S.exam;
  }
  function askHint() {
    const S = Game.S;
    if (S.hints.length >= 3 || S.won || S.exam) return;
    const n = S.hints.length + 1, what = ['', 'назовёт семейство правила', 'предложит полезный эксперимент', 'скажет, какой признак входа важен'][n];
    modal({
      title: `Подсказка № ${n}`,
      html: `<p>Эта подсказка ${what}. Она стоит <b>+2</b> опыта.</p>`,
      actions: [{ label: 'Взять подсказку', cls: 'btn-go', onClick: () => { Game.takeHint(); renderHints(); renderGauges(); tutorEvent('hint'); toast('Подсказка добавлена: +2 опыта'); } }, { label: 'Отмена', cls: 'btn-iron' }],
    });
  }

  /* ---------- обучение ---------- */
  const TUTOR = {
    1: [
      { text: 'Перед вами машина со скрытым правилом. Внизу — приёмный лоток: наберите число кнопками ▲ ▼ или с клавиатуры.', until: ['input', 'run'] },
      { text: 'Нажмите «Запустить». Машина обработает число и выкатит результат в правый лоток.', until: 'run' },
      { text: 'Пара «вход → выход» записана в журнал, счётчик опытов вырос на 1. Подайте ещё два-три разных числа.', until: 'run', min: 3 },
      { text: 'Сравните входы и выходы. Запишите догадку в заметки, а когда уверены — нажмите «Я понял».', until: 'exam' },
      { text: 'Экзамен: машина закрыта шторками. Предскажите выход для каждого входа и нажмите «Сдать». Ошибка — +3 опыта и снова опыты.', until: 'submit' },
    ],
    2: [
      { text: () => `Цель уровня — ${Game.target()} ${D.plural(Game.target(), 'опыт', 'опыта', 'опытов')}: её показывает стрелочный прибор вверху. Уложитесь — получите три звезды.`, until: 'run' },
      { text: 'Застряли? Подсказки справа: семейство правила, удачный опыт или важный признак. Каждая стоит +2 опыта.', until: 'run', min: 2 },
      { text: 'Строки журнала можно закреплять булавкой и помечать кружком, треугольником или квадратом, а журнал — сортировать и фильтровать по выходу.', until: 'exam' },
    ],
    3: [
      { text: 'Правило может состоять из двух частей. Самые полезные опыты — простые: попробуйте 0, затем 1 и 2.', until: 'run', min: 2 },
      { text: 'Каждый опыт должен проверять гипотезу. Если выход вас удивил — гипотеза неверна, ищите другую.', until: 'exam' },
    ],
  };
  function renderTutor() {
    const L = Game.L, S = Game.S, el = $('#tutor'), steps = TUTOR[L.mode === 'campaign' ? L.tut : 0];
    if (!steps || S.won || S.tut >= steps.length) { el.hidden = true; return; }
    const st = steps[S.tut], txt = typeof st.text === 'function' ? st.text() : st.text;
    el.hidden = false;
    el.innerHTML = `<div>${txt}</div><div class="t-row"><span class="dots">шаг ${S.tut + 1} из ${steps.length}</span><button type="button" class="btn btn-sm btn-iron" id="tutSkip">Понятно</button></div>`;
    $('#tutSkip').onclick = () => { Snd.click(); S.tut++; Game.persist(); renderTutor(); };
  }
  function tutorEvent(ev) {
    const L = Game.L, S = Game.S, steps = TUTOR[L.mode === 'campaign' ? L.tut : 0];
    if (!steps || S.tut >= steps.length) return;
    const st = steps[S.tut];
    if ([].concat(st.until).includes(ev) && (!st.min || S.exp >= st.min)) { S.tut++; Game.persist(); renderTutor(); }
  }

  /* ---------- самопроверка (режим отладки) ---------- */
  function runSelfTest() {
    const p = $('#debugPanel');
    p.hidden = false;
    p.innerHTML = '<h2 class="plate-title">Режим отладки · самопроверка</h2><p>Идёт проверка 48 уровней…</p>';
    setTimeout(() => {
      const t0 = performance.now(), rep = Exam.selfTest(), ms = Math.round(performance.now() - t0);
      const okN = rep.filter(r => r.ok).length;
      p.innerHTML = `<h2 class="plate-title">Режим отладки · самопроверка <span class="${okN === rep.length ? 'good' : 'bad'}">${okN}/${rep.length} OK</span></h2>
        <p style="font-size:13px">Для каждого уровня: 500 случайных входов без ошибок и с корректным типом выхода; три разных экзамена отличают правило от всех двойников; цель конечна. Время: ${ms} мс. Все уровни открыты.</p>
        <div class="debug-scroll"><table><thead><tr><th>№</th><th>Цех</th><th>Правило</th><th>Цель</th><th>Итог</th></tr></thead><tbody>${rep.map(r => `<tr><td>${r.i + 1}</td><td>${Levels.WORLDS[Levels.DEFS[r.i].w].name}</td><td>${r.rule || ''}</td><td>${r.target || '—'}</td><td class="${r.ok ? 'good' : 'bad'}">${r.ok ? 'OK' : r.errs.join('; ')}</td></tr>`).join('')}</tbody></table></div>`;
      if (window.console) console.table(rep.map(r => ({ n: r.i + 1, ok: r.ok, target: r.target, rule: r.rule, errs: (r.errs || []).join('; ') })));
    }, 60);
  }

  /* ---------- инициализация ---------- */
  function init() {
    applyMotion(); applySound();
    if (mq.addEventListener) mq.addEventListener('change', applyMotion);
    const unlock = () => { Snd.unlock(); document.removeEventListener('pointerdown', unlock, true); document.removeEventListener('keydown', unlock, true); };
    document.addEventListener('pointerdown', unlock, true); document.addEventListener('keydown', unlock, true);
    const toggleSound = () => { Store.data.settings.mute = !Store.data.settings.mute; Store.save(); applySound(); if (!Store.data.settings.mute) Snd.press(); };
    $('#btnSound').onclick = toggleSound; $('#btnSoundMap').onclick = toggleSound;
    $('#btnMotion').onclick = () => { Store.data.settings.lessMotion = !Store.data.settings.lessMotion; Store.save(); applyMotion(); Snd.click(); };
    $('#btnBack').onclick = () => { Snd.press(); if (modalClose) modalClose(true); showMap(); };
    $('#factory').addEventListener('click', e => { const b = e.target.closest('.lvl-btn'); if (b && !b.disabled) { Snd.press(); openCampaign(+b.dataset.lvl); } });
    $('#btnHint').onclick = () => { Snd.click(); askHint(); };
    $('#hintList').addEventListener('click', e => {
      const b = e.target.closest('[data-put]'); if (!b || !editor || Game.S.exam || Game.S.won) return;
      const h = Game.S.hints.find(x => x.n === 2); if (h) { editor.set(h.hist[0]); Snd.click(); toast('Вход положен в лоток'); }
    });
    $('#jSort').onchange = e => { jSort = e.target.value; renderJournal(); };
    $('#jFilter').onchange = e => { jFilter = e.target.value; renderJournal(); };
    $('#journal').addEventListener('click', e => {
      const b = e.target.closest('button[data-act]'); if (!b) return;
      const id = +b.closest('.jrow').dataset.id, ent = Game.S.journal.find(x => x.id === id); if (!ent) return;
      if (b.dataset.act === 'pin') ent.pinned = !ent.pinned; else ent.mark = (ent.mark + 1) % 4;
      Snd.click(); Game.persist(); renderJournal();
      const nb = document.querySelector(`.jrow[data-id="${id}"] button[data-act="${b.dataset.act}"]`); if (nb) nb.focus();
    });
    let nt = 0;
    $('#notes').addEventListener('input', e => { Game.S.notes = e.target.value; clearTimeout(nt); nt = setTimeout(() => Game.persist(), 300); });
    document.addEventListener('keydown', e => {
      const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
      if (!typing && !modalClose && editor && editor.onKey && !$('#scr-level').hidden && Game.S && !Game.S.exam && !Game.S.won && document.body.contains(editor.el)) editor.onKey(e);
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !$('#scr-level').hidden && !modalClose) {
        e.preventDefault();
        if (Game.S && Game.S.exam) submitExam(); else if (Game.S && !Game.S.won) runExperiment();
      }
    });
    showMap();
    if (DEBUG) runSelfTest();
    if (!Store.available) setTimeout(() => toast('Хранилище недоступно: прогресс не сохранится после закрытия'), 800);
  }
  return { init, reduced, DEBUG, levelUnlocked };
})();

document.addEventListener('DOMContentLoaded', UI.init);

</script>
</body>
</html>
